<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali - Shayari</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#ffffff;
  --muted:#9aa4b2;
  --accent:#ad0000;
  --border:#000000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui;}
.banner{height:240px;background:url('BANNER/unsplash.png.jpg.jpg') center/cover no-repeat;border-bottom:1px solid var(--border);}
.banner-inner{max-width:1200px;margin:auto;height:100%;padding:20px;display:flex;align-items:flex-end;gap:20px;}
.logo{width:100px;height:100px;border-radius:50%;overflow:hidden;border:2px solid var(--border);}
.logo img{width:100%;height:100%;object-fit:cover}
.author-meta h1{font-family:"Noto Nastaliq Urdu",serif;font-size:2.2rem;}
.nav{position:sticky;top:0;background:#0f1115;border-bottom:1px solid var(--border);z-index:10;}
.nav ul{max-width:1200px;margin:auto;display:flex;gap:6px;padding:8px;list-style:none;}
.nav button{background:none;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;}
.nav button.active{background:#315a80}
.wrap{max-width:1200px;margin:auto;padding:16px;}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;}
.intro{direction:rtl;text-align:right;font-family:"Noto Nastaliq Urdu",serif;line-height:2.3;}
.list{display:grid;gap:12px}
.item{background:var(--card);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr auto;align-items:center;}
.item h3{font-family:"Noto Nastaliq Urdu",serif;cursor:pointer;}
.meta{font-size:13px;color:var(--muted)}
.fav{background:#000;color:var(--accent);border:none;border-radius:8px;padding:8px;cursor:pointer;}
.fav.active{background:var(--accent);color:#000}
#nameForm{max-width:400px;margin:50px auto;background:#161a22;padding:20px;border-radius:14px;display:flex;flex-direction:column;gap:10px;}
#nameForm input, #nameForm button{padding:10px;border-radius:6px;border:none;font-size:1rem;}
#nameForm button{background:#ad0000;color:#fff;font-weight:bold;cursor:pointer;}
footer{text-align:center;padding:20px;color:var(--muted);}
</style>
</head>
<body>

<header class="banner">
  <div class="banner-inner">
    <div class="logo"><img src="logo/proble.png.png"></div>
    <div class="author-meta">
      <h1>شافع علی</h1>
      <p>احمد فراز کی شاعری سے فیض یافتہ لفظیات</p>
    </div>
  </div>
</header>

<main class="wrap">

<!-- Name Form -->
<div id="nameForm">
  <h3>براہ کرم اپنا نام درج کریں</h3>
  <input type="text" id="visitorName" placeholder="آپ کا نام" required>
  <button onclick="submitName()">جمع کریں</button>
</div>

<!-- Shayari Section (hidden initially) -->
<section id="shayariSection" style="display:none;">
  <section class="card">
    <h4>تعارف</h4>
    <div class="intro">
      نام: شافع علی<br>
      پیدائش: 19 دسمبر 2006<br>
      ملک: پاکستان<br>
      شہر: کراچی<br>
      پسندیدہ شاعر: احمد فراز
    </div>
  </section>

  <nav class="nav">
  <ul>
    <li><button class="active" data-tab="all">سب</button></li>
    <li><button data-tab="ghazal">غزل</button></li>
    <li><button data-tab="nazm">نظم</button></li>
    <li><button data-tab="sher">شعر</button></li>
    <li><button data-tab="favs">پسندیدہ</button></li>
  </ul>
  </nav>

  <section>
    <div id="list" class="list">لوڈ ہو رہا ہے…</div>
  </section>
</section>

</main>

<footer>© Shafay Ali 2025</footer>

<script>
// Google Form URL (replace with your form's link)
const FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLScmgf8PCFPUH8IRAmEzTRfS8-6nYC2w7X1odPQ/viewform?usp=pp_url&entry.1234567890="; // Replace entry ID with your form field

const API="data.json"; // local JSON
let ALL_DATA=[];
const list=document.getElementById("list");
const favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));

function saveFavs(){
  localStorage.setItem("favs",JSON.stringify([...favs]));
}

// Render function
function render(filter="all"){
  list.innerHTML="";
  let items=[...ALL_DATA];
  if(filter==="favs") items=items.filter(i=>favs.has(i.id));
  else if(filter!=="all") items=items.filter(i=>i.type===filter);

  if(items.length===0){
    list.innerHTML="<p style='color:#9aa4b2'>کوئی شاعری موجود نہیں</p>";
    return;
  }

  items.forEach(d=>{
    const el=document.createElement("div");
    el.className="item";
    el.innerHTML=`
      <div>
        <h3>${d.title}</h3>
        <div class="meta">${d.type}</div>
      </div>
      <button class="fav ${favs.has(d.id)?"active":""}">❤</button>
    `;
    el.querySelector("h3").onclick=()=>{ location.href=`read.html?id=${d.id}`; };
    el.querySelector(".fav").onclick=e=>{
      e.stopPropagation();
      favs.has(d.id)?favs.delete(d.id):favs.add(d.id);
      saveFavs();
      render(filter);
    };
    list.appendChild(el);
  });
}

// Fetch JSON
async function fetchData(){
  try{
    const r=await fetch(API);
    ALL_DATA=await r.json();
    render();
  }catch{
    list.innerHTML="<p style='color:red'>ڈیٹا لوڈ نہیں ہو سکا</p>";
  }
}

// Submit Name Function
function submitName(){
  const name=document.getElementById("visitorName").value.trim();
  if(!name) return alert("براہ کرم اپنا نام درج کریں");
  
  // Open Google Form submit in new tab (name + date/time)
  const datetime=encodeURIComponent(new Date().toLocaleString());
  const url=FORM_URL+encodeURIComponent(name)+"&entry.9876543210="+datetime; // Replace entry.9876543210 with datetime field ID
  window.open(url,"_blank");

  // Hide form, show shayari
  document.getElementById("nameForm").style.display="none";
  document.getElementById("shayariSection").style.display="block";

  fetchData();
}

// Nav buttons
document.querySelectorAll(".nav button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.tab);
  };
});
</script>

</body>
</html>
