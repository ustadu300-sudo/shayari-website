<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali – Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:"Noto Nastaliq Urdu",serif;
  padding:20px;
}
h1{text-align:center;margin-bottom:20px}
.nav{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:20px;
}
button{
  padding:8px 18px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  background:#ad0000;
  color:#fff;
}
.card{
  background:#161a22;
  padding:18px;
  border-radius:14px;
  margin-bottom:14px;
  cursor:pointer;
}
small{color:#aaa}
</style>
</head>

<body>

<h1>شافع علی</h1>

<div class="nav">
  <button onclick="showAll()">تمام</button>
  <button onclick="showFav()">پسندیدہ</button>
</div>

<div id="list"></div>

<script>
const DATA_URL="data.json";
const favs = JSON.parse(localStorage.getItem("favs")||"[]");
let all=[];

fetch(DATA_URL).then(r=>r.json()).then(d=>{
  all=d;
  render(all);
});

function render(arr){
  list.innerHTML="";
  arr.forEach(s=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<h3>${s.title}</h3><small>${s.type}</small>`;
    div.onclick=()=>location.href=`read.html?id=${s.id}`;
    list.appendChild(div);
  });
}

function showFav(){
  render(all.filter(s=>favs.includes(s.id)));
}
function showAll(){render(all)}
</script>

</body>
</html>
