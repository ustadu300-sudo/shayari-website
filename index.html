<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali – Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "2c2a67d7-e712-44c2-8233-9413718f8d75",
  });
});
</script>

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --accent:#ad0000;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:Inter}

/* ===== GATE ===== */
body.lock main,body.lock header,body.lock nav{filter:blur(6px);pointer-events:none}
#gate{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;
}
#gate .box{
  background:var(--card);
  padding:26px;border-radius:14px;
  max-width:360px;text-align:center;
}
#gate h3{font-family:"Noto Nastaliq Urdu",serif;line-height:2.2}
#gate input,#gate button{
  width:100%;padding:12px;margin-top:12px;border-radius:8px;border:none;
}
#gate button{background:var(--accent);color:#fff;font-weight:bold}

/* ===== HEADER ===== */
.banner{
  height:240px;
  background:url("BANNER/unsplash.png.jpg.jpg") center/cover no-repeat;
}
.banner-inner{
  max-width:1200px;margin:auto;height:100%;
  display:flex;align-items:flex-end;gap:18px;padding:20px;
}
.logo{width:90px;height:90px;border-radius:50%;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.author-meta h1{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:2.3rem;
}
.author-meta p{
  font-family:"Noto Nastaliq Urdu",serif;
  font-weight:bold;
}

/* ===== NAV ===== */
.nav{position:sticky;top:0;background:#0f1115}
.nav ul{display:flex;gap:8px;list-style:none;padding:10px}
.nav button{background:none;border:none;color:#fff;padding:8px 14px;cursor:pointer}
.nav button.active{background:#315a80;border-radius:8px}

/* ===== LIST ===== */
.wrap{max-width:1200px;margin:auto;padding:16px}
.item{
  background:var(--card);
  padding:16px;border-radius:14px;margin-bottom:14px;
  cursor:pointer;
}
.item h3{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.5rem;
  text-align:right;
}
</style>
</head>

<body class="lock">

<div id="gate">
  <div class="box">
    <h3>نوٹیفکیشن آن کریں<br>اور اپنا نام درج کریں</h3>
    <input id="username" placeholder="اپنا نام لکھیں">
    <button id="continueBtn">جاری رکھیں</button>
  </div>
</div>

<header class="banner">
  <div class="banner-inner">
    <div class="logo"><img src="logo/proble.png.png"></div>
    <div class="author-meta">
      <h1>شافع علی</h1>
      <p>میں جو ہوں، شافع ہوں</p>
    </div>
  </div>
</header>

<nav class="nav">
<ul>
  <li><button class="active" data-type="all">سب</button></li>
  <li><button data-type="ghazal">غزل</button></li>
  <li><button data-type="nazm">نظم</button></li>
  <li><button data-type="sher">شعر</button></li>
</ul>
</nav>

<main class="wrap">
  <div id="list">لوڈ ہو رہا ہے…</div>
</main>

<script>
const gate=document.getElementById("gate");
const btn=document.getElementById("continueBtn");

btn.onclick=async()=>{
  const name=username.value.trim();
  if(!name){alert("نام درج کریں");return;}
  const p=await Notification.requestPermission();
  if(p!=="granted"){alert("نوٹیفکیشن لازمی ہے");return;}
  localStorage.setItem("visitorName",name);
  document.body.classList.remove("lock");
  gate.style.display="none";
};

async function load(type="all"){
  const data=await fetch("data.json").then(r=>r.json());
  list.innerHTML="";
  data.filter(s=>type==="all"||s.type===type).forEach(s=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`<h3>${s.title}</h3>`;
    d.onclick=()=>location.href=`read.html?id=${s.id}`;
    list.appendChild(d);
  });
}

document.querySelectorAll(".nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    load(b.dataset.type);
  };
});
load();
</script>

</body>
</html>
