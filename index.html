<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali | Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#fff;
  --accent:#b00000;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui;
}

/* LOCK */
body.lock main{filter:blur(6px);pointer-events:none}
body.lock{overflow:hidden}

/* ENTRY MODAL */
#gate{
  position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:center;
  z-index:999;
}
#gate .box{
  background:var(--card);
  padding:26px;
  border-radius:18px;
  text-align:center;
  max-width:360px;
}
#gate h3{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.4;
}
#gate input{
  width:100%;margin-top:14px;padding:12px;
  border-radius:10px;border:none;
}
#gate button{
  margin-top:14px;width:100%;
  padding:12px;border:none;
  background:var(--accent);
  font-weight:bold;cursor:pointer;
}

/* HEADER */
header{text-align:center}
.banner{
  width:100%;
  max-height:220px;
  object-fit:cover;
}
.logo{
  max-width:120px;
  margin-top:-60px;
  background:#000;
  border-radius:50%;
  padding:6px;
}

/* LIST */
main{max-width:900px;margin:auto;padding:20px}
.card{
  background:var(--card);
  padding:18px;
  border-radius:16px;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:.3s;
}
.card:hover{transform:scale(1.02)}

.title{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.15rem;
}

.heart{
  width:34px;height:34px;
  border-radius:50%;
  border:2px solid var(--accent);
  background:none;
  color:var(--accent);
  cursor:pointer;
  transition:.3s;
}
.heart.active{
  background:var(--accent);
  color:#000;
  transform:scale(1.15);
}
</style>
</head>

<body class="lock">

<!-- ENTRY -->
<div id="gate">
  <div class="box">
    <h3>
      نئی شاعری کی اطلاع کے لیے<br>
      نوٹیفکیشن آن کریں<br><br>
      اور اپنا نام درج کریں
    </h3>
    <input id="name" placeholder="اپنا نام درج کریں">
    <button id="enter">داخل ہوں</button>
  </div>
</div>

<header>
  <!-- ⚠️ PATHS SAME RAKHNA -->
  <img src="banner/banner.jpg" class="banner">
  <img src="logo/logo.png" class="logo">
</header>

<main id="list"></main>

<script>
const SCRIPT="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";
const DATA="data.json";

let user=localStorage.getItem("userName");

function log(action,title=""){
  fetch(`${SCRIPT}?name=${encodeURIComponent(user)}&action=${action}&title=${encodeURIComponent(title)}&notify=${Notification.permission}`);
}

document.getElementById("enter").onclick=()=>{
  const n=document.getElementById("name").value.trim();
  if(!n) return alert("نام درج کریں");

  Notification.requestPermission().then(p=>{
    if(p!=="granted"){
      alert("نوٹیفکیشن آن کیے بغیر ویب سائٹ استعمال نہیں کی جا سکتی");
      return;
    }
    user=n;
    localStorage.setItem("userName",n);
    log("visit");
    unlock();
  });
};

function unlock(){
  document.body.classList.remove("lock");
  document.getElementById("gate").style.display="none";
  load();
}

if(user && Notification.permission==="granted") unlock();

function load(){
  fetch(DATA).then(r=>r.json()).then(data=>{
    const list=document.getElementById("list");
    let fav=new Set(JSON.parse(localStorage.getItem("fav")||"[]"));

    data.forEach(s=>{
      const c=document.createElement("div");
      c.className="card";

      const t=document.createElement("div");
      t.className="title";
      t.textContent=s.title;

      const h=document.createElement("button");
      h.className="heart";
      h.innerHTML="♡";
      if(fav.has(s.id)) h.classList.add("active");

      h.onclick=e=>{
        e.stopPropagation();
        if(fav.has(s.id)){
          fav.delete(s.id);
          h.classList.remove("active");
          log("unfavorite",s.title);
        }else{
          fav.add(s.id);
          h.classList.add("active");
          log("favorite",s.title);
        }
        localStorage.setItem("fav",JSON.stringify([...fav]));
      };

      c.onclick=()=>{
        log("read",s.title);
        location.href=`read.html?id=${s.id}`;
      };

      c.append(t,h);
      list.appendChild(c);
    });
  });
}
</script>

</body>
</html>
