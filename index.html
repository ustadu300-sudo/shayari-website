<script>
const SCRIPT="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";

const list=document.getElementById("list");
const gate=document.getElementById("gate");
const continueBtn=document.getElementById("continueBtn");
const username=document.getElementById("username");
const navButtons=[...document.querySelectorAll(".nav button")];

let allData=[];
let currentFilter="سب";
let favourites=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));

/* ===== GATE ===== */
continueBtn.onclick=async()=>{
  const name=username.value.trim();
  if(!name){ alert("نام درج کریں"); return; }

  let perm=Notification.permission;
  if(perm!=="granted"){
    perm=await Notification.requestPermission();
  }

  if(perm!=="granted"){
    alert("نوٹیفکیشن آن کیے بغیر ویب سائٹ استعمال نہیں کی جا سکتی");
    return;
  }

  localStorage.setItem("visitorName",name);
  fetch(`${SCRIPT}?name=${encodeURIComponent(name)}&notify=granted`);

  document.body.classList.remove("lock");
  gate.style.display="none";
};

if(localStorage.getItem("visitorName") && Notification.permission==="granted"){
  document.body.classList.remove("lock");
  gate.style.display="none";
}

/* ===== LOAD DATA ===== */
fetch("data.json")
.then(r=>r.json())
.then(d=>{
  allData=d;
  render();
});

function render(){
  list.innerHTML="";
  allData
    .filter(s=>{
      if(currentFilter==="سب") return true;
      if(currentFilter==="پسندیدہ") return favourites.has(s.id);
      return s.type===currentFilter;
    })
    .forEach(s=>{
      const div=document.createElement("div");
      div.className="item";
      div.innerHTML=`
        <h3>
          ${s.title}
          <span class="heart ${favourites.has(s.id)?"active":""}">❤</span>
        </h3>
      `;

      div.onclick=e=>{
        if(e.target.classList.contains("heart")){
          e.stopPropagation();
          toggleFav(s);
          e.target.classList.toggle("active");
        }else{
          location.href=`read.html?id=${s.id}`;
        }
      };

      list.appendChild(div);
    });
}

function toggleFav(s){
  const name=localStorage.getItem("visitorName");
  if(favourites.has(s.id)){
    favourites.delete(s.id);
    fetch(`${SCRIPT}?name=${encodeURIComponent(name)}&action=favourite_remove&title=${encodeURIComponent(s.title)}`);
  }else{
    favourites.add(s.id);
    fetch(`${SCRIPT}?name=${encodeURIComponent(name)}&action=favourite_add&title=${encodeURIComponent(s.title)}`);
  }
  localStorage.setItem("favs",JSON.stringify([...favourites]));
}

/* ===== NAV FILTER ===== */
navButtons.forEach(btn=>{
  btn.onclick=()=>{
    navButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter=btn.innerText;
    render();
  };
});
</script>
