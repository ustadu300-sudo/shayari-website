<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Shayari & Dictionary</title>
<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui;
  padding:20px;
}
input,textarea,select,button{
  width:100%;
  margin:6px 0;
  padding:10px;
  border-radius:6px;
  border:none;
}
textarea{height:120px}
button{
  background:#ad0000;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
pre{
  background:#161a22;
  padding:10px;
  border-radius:8px;
  max-height:300px;
  overflow:auto;
}
h3{margin-top:30px}
.word{cursor:pointer;text-decoration:underline;}
.meaning{display:none;}
</style>
</head>
<body>

<h2>➕ شاعری شامل کریں</h2>

<input id="title" placeholder="عنوان">
<select id="type">
  <option value="ghazal">غزل</option>
  <option value="nazm">نظم</option>
  <option value="sher">شعر</option>
</select>
<textarea id="text" placeholder="شاعری"></textarea>
<button onclick="addShayari()">Add Shayari</button>

<h3>📚 لغت / Dictionary</h3>
<input id="word" placeholder="لفظ">
<input id="meaning" placeholder="معنی">
<button onclick="addWord()">Add Meaning</button>

<h3>📦 data.json</h3>
<pre id="out"></pre>

<script>
const data = [];
const dict = {};
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXT7167jMMrwRkEbSSy0CyBiWNQexc4yK3vIqmHSvE6kC3ZUiXS4iyAhNjFiENn1vxEg/exec";

function addShayari(){
  const sh = {
    id: Date.now().toString(),
    title: title.value,
    type: type.value,
    text: text.value + "\n\n— شافع",
    dictionary: {...dict}
  };
  data.push(sh);
  // Send to Google Sheet
  const params = new URLSearchParams();
  params.append("name", "Admin");
  params.append("action", "add_shayari");
  params.append("title", sh.title);
  params.append("type", sh.type);
  params.append("text", sh.text);
  params.append("dictionary", JSON.stringify(sh.dictionary));
  fetch(`${SCRIPT_URL}?${params.toString()}`).then(r=>r.text()).then(console.log).catch(console.error);

  render();
}

function addWord(){
  if(!word.value || !meaning.value) return;
  dict[word.value] = meaning.value;
  word.value = meaning.value = "";
  render();
}

function render(){
  out.textContent = JSON.stringify({
    shayari:data,
    dictionary:dict
  },null,2);
}

// Optional: show dictionary on click for mobile
function createWordElement(word, meaning){
  const span = document.createElement("span");
  span.className = "word";
  span.textContent = word;
  span.onclick = ()=>alert(`${word} : ${meaning}`);
  return span;
}
</script>

</body>
</html>
