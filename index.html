<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Website</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f1115;
  color:#fff;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
#nameBox{
  background:#161a22;
  padding:20px;
  border-radius:12px;
}
#nameBox input{
  width:100%;
  padding:12px;
  font-size:16px;
}
#nameBox button{
  width:100%;
  margin-top:10px;
  padding:12px;
  background:#ad0000;
  color:#fff;
  border:none;
  font-size:16px;
  cursor:pointer;
}
#thanks{
  display:none;
  text-align:center;
  font-family:"Noto Nastaliq Urdu";
  font-size:22px;
}
#content{
  display:none;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<!-- NAME FORM -->
<div id="nameBox">
  <form id="nameForm" target="hiddenFrame"
    action="https://script.google.com/macros/s/AKfycbwz7I-tCUdr_8vid7vp9dZtYcSlkLZQIx0HfkiRjwj7ltJzuugX-n7WxYyYYYGtoyHR/exec"
    method="GET"
    onsubmit="handleSubmit()">

    <input type="text" name="name" id="visitorName" placeholder="اپنا نام درج کریں" required>
    <button type="submit">جاری رکھیں</button>
  </form>
</div>

<!-- THANK YOU -->
<div id="thanks">شکریہ ❤️</div>

<!-- WEBSITE CONTENT -->
<div id="content">
  <h2>ویب سائٹ کا اصل مواد</h2>
  <p>اب یہ مواد صرف اسی وقت نظر آئے گا جب وزیٹر اپنا نام درج کرے۔</p>
</div>

</div>

<!-- hidden iframe (IMPORTANT) -->
<iframe name="hiddenFrame" style="display:none;"></iframe>

<script>
function handleSubmit(){
  const name = document.getElementById("visitorName").value.trim();
  if(!name) return false;

  localStorage.setItem("visitorName", name);

  document.getElementById("nameBox").style.display="none";
  document.getElementById("thanks").style.display="block";

  setTimeout(()=>{
    document.getElementById("thanks").style.display="none";
    document.getElementById("content").style.display="block";
  },1500);
}

// agar pehle visit kar chuka ho
if(localStorage.getItem("visitorName")){
  document.getElementById("nameBox").style.display="none";
  document.getElementById("content").style.display="block";
}
</script>

</body>
</html>
