<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Poetry</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#ffffff;
  font-family:Inter,system-ui;
  margin:0;
  padding:20px;
}
.wrap{
  max-width:900px;
  margin:auto;
}
.card{
  background:#161a22;
  border-radius:16px;
  padding:20px;
}
h1{
  font-family:"Noto Nastaliq Urdu",serif;
  text-align:center;
  margin:0 0 20px 0;
}
.item{
  padding:14px 0;
  border-bottom:1px solid #232836;
}
.item:last-child{
  border-bottom:none;
}
.title{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.4rem;
  line-height:2;
}
.type{
  color:#9aa4b2;
  font-size:0.85rem;
  margin-bottom:6px;
}
.read-btn{
  display:inline-block;
  margin-top:6px;
  background:#315a80;
  color:#ffffff;
  padding:6px 16px;
  border-radius:8px;
  text-decoration:none;
  font-size:0.9rem;
}
.read-btn:hover{
  opacity:0.85;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">
    <h1>شفاعے کی شاعری</h1>
    <div id="list">لوڈ ہو رہا ہے…</div>
  </div>
</div>

<script>
const API = "https://sheetdb.io/api/v1/dl6yhkvu4ynyy";

async function loadPoetry(){
  try{
    const res = await fetch(API);
    const data = await res.json();
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.reverse().forEach(item=>{
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="title">${item.title}</div>
        <div class="type">${item.type}</div>
        <a class="read-btn" href="read.html?id=${item.id}">پڑھیں</a>
      `;
      list.appendChild(div);
    });

    if(data.length===0){
      list.textContent="ابھی کوئی شاعری موجود نہیں";
    }

  }catch(e){
    document.getElementById("list").textContent="ڈیٹا لوڈ نہیں ہو سکا";
  }
}

loadPoetry();
</script>

</body>
</html>
