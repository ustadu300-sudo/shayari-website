<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali | Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#ffffff;
  --muted:#9aa4b2;
  --accent:#b00000;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui;
}

/* ---------- ENTRY GATE ---------- */
body.lock{overflow:hidden}
body.lock main{filter:blur(6px);pointer-events:none}

#gate{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#gate .box{
  background:var(--card);
  padding:28px;
  border-radius:18px;
  max-width:340px;
  text-align:center;
}

#gate h3{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.3;
  font-size:1.1rem;
}

#gate input{
  width:100%;
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  border:none;
}

#gate button{
  margin-top:14px;
  width:100%;
  padding:12px;
  background:var(--accent);
  color:#000;
  font-weight:bold;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* ---------- HEADER ---------- */
header{
  padding:18px;
  text-align:center;
}

header img{
  max-width:120px;
}

/* ---------- SHAYARI LIST ---------- */
main{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.shayari{
  background:var(--card);
  padding:18px;
  border-radius:16px;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:.3s;
}

.shayari:hover{
  transform:scale(1.02);
}

.title{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.2rem;
}

.heart{
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid var(--accent);
  color:var(--accent);
  background:none;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

.heart.filled{
  background:var(--accent);
  color:#000;
  transform:scale(1.15);
}
</style>
</head>

<body class="lock">

<!-- ENTRY GATE -->
<div id="gate">
  <div class="box">
    <h3>
      نئی آنے والی شاعری کی اطلاع<br>
      حاصل کرنے کے لیے نوٹیفکیشن آن کریں<br><br>
      اور اپنا نام درج کریں
    </h3>
    <input id="userName" placeholder="اپنا نام درج کریں">
    <button id="enterBtn">ویب سائٹ میں داخل ہوں</button>
  </div>
</div>

<header>
  <!-- ❗ logo / banner paths untouched -->
  <img src="logo/logo.png" alt="Shafay Ali">
</header>

<main id="list"></main>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";
const DATA_URL="data.json";

let visitor=localStorage.getItem("visitorName");

function log(action,title=""){
  const dt=new Date().toLocaleString("en-US",{timeZone:"Asia/Karachi"});
  fetch(`${SCRIPT_URL}?name=${encodeURIComponent(visitor)}&datetime=${encodeURIComponent(dt)}&action=${action}&title=${encodeURIComponent(title)}&notification=${Notification.permission}`);
}

document.getElementById("enterBtn").onclick=()=>{
  const name=document.getElementById("userName").value.trim();
  if(!name){alert("نام درج کریں");return;}

  Notification.requestPermission().then(p=>{
    if(p!=="granted"){
      alert("نوٹیفکیشن آن کیے بغیر مواد دستیاب نہیں");
      return;
    }
    visitor=name;
    localStorage.setItem("visitorName",name);
    log("visit");
    document.getElementById("gate").style.display="none";
    document.body.classList.remove("lock");
    loadData();
  });
};

if(visitor && Notification.permission==="granted"){
  document.getElementById("gate").style.display="none";
  document.body.classList.remove("lock");
  loadData();
}

function loadData(){
  fetch(DATA_URL).then(r=>r.json()).then(data=>{
    const list=document.getElementById("list");
    let favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));

    data.forEach(s=>{
      const row=document.createElement("div");
      row.className="shayari";

      const t=document.createElement("div");
      t.className="title";
      t.textContent=s.title;

      const h=document.createElement("button");
      h.className="heart";
      h.innerHTML="♡";

      if(favs.has(s.id)) h.classList.add("filled");

      h.onclick=e=>{
        e.stopPropagation();
        if(favs.has(s.id)){
          favs.delete(s.id);
          h.classList.remove("filled");
          log("unfavorite",s.title);
        }else{
          favs.add(s.id);
          h.classList.add("filled");
          log("favorite",s.title);
        }
        localStorage.setItem("favs",JSON.stringify([...favs]));
      };

      row.onclick=()=>{
        log("read",s.title);
        location.href=`read.html?id=${s.id}`;
      };

      row.appendChild(t);
      row.appendChild(h);
      list.appendChild(row);
    });
  });
}
</script>

</body>
</html>
