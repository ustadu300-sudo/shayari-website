<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali - Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#ffffff;
  --muted:#9aa4b2;
  --accent:#ad0000;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter}

.banner{
  height:240px;
  background:url('BANNER/unsplash.png.jpg.jpg') center/cover no-repeat;
}
.banner-inner{
  max-width:1200px;margin:auto;height:100%;
  padding:20px;display:flex;align-items:flex-end;gap:20px;
}
.logo{
  width:100px;height:100px;border-radius:50%;
  overflow:hidden;border:2px solid #000;
}
.logo img{width:100%;height:100%;object-fit:cover}

.author-meta h1{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:2.2rem;
}

.nav{
  position:sticky;top:0;background:#0f1115;
  z-index:10;border-bottom:1px solid #000;
}
.nav ul{
  max-width:1200px;margin:auto;
  display:flex;gap:6px;padding:8px;list-style:none;
}
.nav button{
  background:none;color:#fff;border:none;
  padding:8px 14px;border-radius:8px;
  cursor:pointer;
}
.nav button.active{background:#315a80}

.wrap{max-width:1200px;margin:auto;padding:16px}

.item{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
  cursor:pointer;
  transition:.25s;
}
.item:hover{transform:scale(1.01)}

.item h3{
  font-family:"Noto Nastaliq Urdu",serif;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.heart{
  font-size:20px;
  color:transparent;
  -webkit-text-stroke:1.5px red;
  cursor:pointer;
}
.heart.active{
  color:red;
}

.meta{font-size:13px;color:var(--muted)}

footer{text-align:center;padding:20px;color:var(--muted)}

/* GATE */
#gate{
  position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:center;
  z-index:999;
}
#gate .box{
  background:var(--card);
  padding:26px;border-radius:14px;
  text-align:center;max-width:360px;
}
#gate h3{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.4;
}
#gate input{
  width:100%;margin-top:12px;
  padding:12px;border-radius:8px;border:none;
}
#gate button{
  margin-top:12px;width:100%;
  padding:12px;border:none;
  background:var(--accent);
  color:#fff;font-weight:bold;
}
body.lock *:not(#gate){filter:blur(6px);pointer-events:none}
</style>
</head>

<body class="lock">

<div id="gate">
  <div class="box">
    <h3>
      نئی شاعری کی اطلاع کے لیے نوٹیفکیشن آن کریں<br><br>
      اپنا نام درج کریں
    </h3>
    <input id="username" placeholder="اپنا نام لکھیں">
    <button id="continueBtn">جاری رکھیں</button>
  </div>
</div>

<header class="banner">
  <div class="banner-inner">
    <div class="logo"><img src="logo/proble.png.png"></div>
    <div class="author-meta">
      <h1>شافع علی</h1>
      <p>احمد فراز کی شاعری سے فیض یافتہ لفظیات</p>
    </div>
  </div>
</header>

<nav class="nav">
<ul>
  <li><button class="active">سب</button></li>
  <li><button>غزل</button></li>
  <li><button>نظم</button></li>
  <li><button>شعر</button></li>
  <li><button>پسندیدہ</button></li>
</ul>
</nav>

<main class="wrap">
<div id="list">لوڈ ہو رہا ہے…</div>
</main>

<footer>© Shafay Ali 2025</footer>

<script>
const SCRIPT="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";

const gate=document.getElementById("gate");
const continueBtn=document.getElementById("continueBtn");

continueBtn.onclick=async()=>{
  const name=username.value.trim();
  if(!name){alert("نام درج کریں");return;}

  const perm=await Notification.requestPermission();
  if(perm!=="granted"){
    alert("نوٹیفکیشن آن کیے بغیر ویب سائٹ استعمال نہیں کی جا سکتی");
    return;
  }

  localStorage.setItem("visitorName",name);
  fetch(`${SCRIPT}?name=${encodeURIComponent(name)}&notify=granted`);

  document.body.classList.remove("lock");
  gate.style.display="none";
};

if(localStorage.getItem("visitorName") && Notification.permission==="granted"){
  document.body.classList.remove("lock");
  gate.style.display="none";
}

fetch("data.json").then(r=>r.json()).then(data=>{
  list.innerHTML="";
  data.forEach(s=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <h3>
        ${s.title}
        <span class="heart" data-id="${s.id}">❤</span>
      </h3>
      <div class="meta">${s.type}</div>
    `;
    div.onclick=e=>{
      if(e.target.classList.contains("heart")) return;
      location.href=`read.html?id=${s.id}`;
    };
    div.querySelector(".heart").onclick=e=>{
      e.stopPropagation();
      e.target.classList.toggle("active");
      fetch(`${SCRIPT}?name=${localStorage.visitorName}&action=favourite&title=${encodeURIComponent(s.title)}`);
    };
    list.appendChild(div);
  });
});
</script>

</body>
</html>
