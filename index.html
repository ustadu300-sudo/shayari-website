<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>Shayari Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    #nameFormSection {
      margin-top: 50px;
    }

    input {
      padding: 10px;
      width: 250px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    #thankYou {
      display: none;
      font-size: 20px;
      color: green;
      margin-top: 20px;
    }

    #contentSection {
      display: none;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <!-- NAME INPUT -->
  <div id="nameFormSection">
    <h2>اپنا نام درج کریں</h2>
    <input type="text" id="nameInput" placeholder="اپنا نام لکھیں">
    <br><br>
    <button id="nameBtn">Submit</button>

    <div id="thankYou">
      شکریہ ❤️  
    </div>
  </div>

  <!-- MAIN WEBSITE CONTENT -->
  <div id="contentSection">
    <h1>خوش آمدید</h1>
    <p>یہاں آپ کی شاعری / مواد شو ہوگا</p>
    <!-- tumhara baqi website content yahan rahe -->
  </div>

  <!-- SCRIPT -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPInAlJtGvvO5vsiKGsxoeR684XI5GRJlOFuHwOq-WWsYD8nvjP7qCLcGB8gFZOkCp/exec";

    document.getElementById("nameBtn").addEventListener("click", function () {
      const name = document.getElementById("nameInput").value.trim();

      if (!name) {
        alert("براہ کرم اپنا نام درج کریں");
        return;
      }

      const data = new URLSearchParams();
      data.append("name", name);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: data
      })
      .then(() => {
        document.getElementById("thankYou").style.display = "block";

        setTimeout(() => {
          document.getElementById("nameFormSection").style.display = "none";
          document.getElementById("contentSection").style.display = "block";
        }, 1200);
      })
      .catch(err => {
        alert("Data save nahi ho saka");
        console.log(err);
      });
    });
  </script>

</body>
</html>
