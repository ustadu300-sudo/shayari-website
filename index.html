<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari – Home</title>
<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui;
  padding:20px;
}
a{
  display:block;
  margin:8px 0;
  color:#ad0000;
  text-decoration:none;
}
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:none;
}
button{
  background:#ad0000;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<h2>شاعری کی فہرست</h2>

<input id="visitorName" placeholder="اپنا نام درج کریں">
<button onclick="saveName()">شروع کریں</button>

<hr>
<div id="shayariList"></div>

<script>
const DATA_URL="data.json"; // Your local JSON file
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzXT7167jMMrwRkEbSSy0CyBiWNQexc4yK3vIqmHSvE6kC3ZUiXS4iyAhNjFiENn1vxEg/exec";

function saveName(){
  const name = document.getElementById("visitorName").value.trim();
  if(!name) return alert("نام درج کریں");
  localStorage.setItem("visitorName", name);
  loadShayari();
}

// Function to log actions to Google Sheet
function logToSheet(name, action, title="", notify=""){
  fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}&action=${encodeURIComponent(action)}&title=${encodeURIComponent(title)}&notify=${encodeURIComponent(notify)}`)
  .then(res=>res.text())
  .then(console.log)
  .catch(console.error);
}

// Load shayari list
function loadShayari(){
  const name = localStorage.getItem("visitorName");
  if(!name) return;

  fetch(DATA_URL)
    .then(r=>r.json())
    .then(data=>{
      const listDiv = document.getElementById("shayariList");
      listDiv.innerHTML = "";
      data.forEach(s=>{
        const link = document.createElement("a");
        link.href = `read.html?id=${s.id}`;
        link.innerText = s.title + " ("+s.type+")";
        listDiv.appendChild(link);
      });
      logToSheet(name, "visit"); // Log page visit
    })
    .catch(console.error);
}

// Auto load if name is already stored
if(localStorage.getItem("visitorName")) loadShayari();
</script>

</body>
</html>
