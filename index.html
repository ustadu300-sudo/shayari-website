<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali - Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#ffffff;
  --muted:#9aa4b2;
  --accent:#ad0000;
  --border:#000000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui;}

.banner{
  height:240px;
  background:url('BANNER/unsplash.png.jpg.jpg') center/cover no-repeat;
  border-bottom:1px solid var(--border);
}
.banner-inner{
  max-width:1200px;margin:auto;height:100%;
  padding:20px;display:flex;align-items:flex-end;gap:20px;
}
.logo{
  width:100px;height:100px;border-radius:50%;
  overflow:hidden;border:2px solid var(--border);
}
.logo img{width:100%;height:100%;object-fit:cover}
.author-meta h1{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:2.2rem;
}

.nav{
  position:sticky;top:0;
  background:#0f1115;
  border-bottom:1px solid var(--border);
  z-index:10;
}
.nav ul{
  max-width:1200px;margin:auto;
  display:flex;gap:6px;padding:8px;list-style:none;
}
.nav button{
  background:none;color:#fff;border:none;
  padding:8px 14px;border-radius:8px;cursor:pointer;
}
.nav button.active{background:#315a80}

.wrap{max-width:1200px;margin:auto;padding:16px;}
.card{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}
.intro{
  direction:rtl;text-align:right;
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.3;
}

.list{display:grid;gap:12px}
.item{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
}
.item h3{
  font-family:"Noto Nastaliq Urdu",serif;
  cursor:pointer;
}
.meta{font-size:13px;color:var(--muted)}
.fav{
  background:#000;color:var(--accent);
  border:none;border-radius:8px;
  padding:8px;cursor:pointer;
}
.fav.active{background:var(--accent);color:#000}

footer{text-align:center;padding:20px;color:var(--muted);}

/* ===== ENTRY GATE ===== */
#gate{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}
#gate .box{
  background:var(--card);
  padding:28px;
  border-radius:14px;
  text-align:center;
  max-width:340px;
}
#gate h3{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.4;
}
#gate input{
  width:100%;
  margin-top:12px;
  padding:12px;
  border-radius:8px;
  border:none;
}
#gate button{
  margin-top:12px;
  padding:12px;
  width:100%;
  background:var(--accent);
  border:none;
  font-weight:bold;
  cursor:pointer;
}

/* blur when locked */
body.lock header,
body.lock nav,
body.lock main,
body.lock footer{
  filter:blur(6px);
  pointer-events:none;
}
</style>
</head>

<body class="lock">

<!-- ENTRY GATE -->
<div id="gate">
  <div class="box">
    <h3>
      نئی شاعری کی اطلاع کے لیے<br>
      نوٹیفکیشن آن کریں<br><br>
      اور اپنا نام درج کریں
    </h3>
    <input id="username" placeholder="اپنا نام لکھیں">
    <button id="enter">داخل ہوں</button>
  </div>
</div>

<header class="banner">
  <div class="banner-inner">
    <div class="logo">
      <img src="logo/proble.png.png">
    </div>
    <div class="author-meta">
      <h1>شافع علی</h1>
      <p>احمد فراز کی شاعری سے فیض یافتہ لفظیات</p>
    </div>
  </div>
</header>

<nav class="nav">
<ul>
  <li><button class="active">سب</button></li>
  <li><button>غزل</button></li>
  <li><button>نظم</button></li>
  <li><button>شعر</button></li>
  <li><button>پسندیدہ</button></li>
</ul>
</nav>

<main class="wrap">
<section class="card">
<h4>تعارف</h4>
<div class="intro">
نام: شافع علی<br>
پیدائش: 19 دسمبر 2006<br>
ملک: پاکستان<br>
شہر: کراچی<br>
پسندیدہ شاعر: احمد فراز
</div>
</section>

<section>
<div id="list" class="list">لوڈ ہو رہا ہے…</div>
</section>
</main>

<footer>© Shafay Ali 2025</footer>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";

document.getElementById("enter").onclick=()=>{
  const name=document.getElementById("username").value.trim();
  if(!name){ alert("براہِ کرم نام درج کریں"); return; }

  Notification.requestPermission().then(p=>{
    if(p!=="granted"){
      alert("نوٹیفکیشن آن کیے بغیر ویب سائٹ استعمال نہیں کی جا سکتی");
      return;
    }

    localStorage.setItem("visitorName",name);

    fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}&notify=${p}`);

    document.body.classList.remove("lock");
    document.getElementById("gate").style.display="none";
  });
};

if(localStorage.getItem("visitorName") && Notification.permission==="granted"){
  document.body.classList.remove("lock");
  document.getElementById("gate").style.display="none";
}
</script>

</body>
</html>
