<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali - Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#ffffff;
  --muted:#9aa4b2;
  --accent:#ad0000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui;}

.banner{
  height:220px;
  background:#000;
  display:flex;
  align-items:flex-end;
  padding:20px;
}
.banner h1{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:2.2rem;
}

.wrap{max-width:1000px;margin:auto;padding:16px;}

.card{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}

#nameBox input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:1rem;
}
#nameBox button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

#thanks{
  text-align:center;
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.4rem;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:20px;
}
</style>
</head>

<body>

<header class="banner">
  <h1>شافع علی</h1>
</header>

<main class="wrap">

<!-- NAME INPUT -->
<section class="card" id="nameSection">
  <div id="nameBox">
    <input type="text" id="visitorName" placeholder="اپنا نام لکھیں" required>
    <button onclick="submitName()">جاری رکھیں</button>
  </div>
</section>

<!-- THANK YOU -->
<section class="card" id="thanks" style="display:none;">
  شکریہ ❤️  
</section>

<!-- WEBSITE CONTENT -->
<section class="card" id="content" style="display:none;">
  <p>یہاں آپ کی شاعری کا مکمل مواد ظاہر ہوگا۔</p>
</section>

</main>

<footer>© Shafay Ali</footer>

<script>
// ✅ YOUR GOOGLE APPS SCRIPT URL
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwz7I-tCUdr_8vid7vp9dZtYcSlkLZQIx0HfkiRjwj7ltJzuugX-n7WxYyYYYGtoyHR/exec";

function submitName(){
  const name = document.getElementById("visitorName").value.trim();
  if(!name){
    alert("براہ کرم اپنا نام درج کریں");
    return;
  }

  // save locally (dobara na pooche)
  localStorage.setItem("visitorName", name);

  // send to google sheet (background, no redirect)
  fetch(SCRIPT_URL + "?name=" + encodeURIComponent(name))
    .then(()=>console.log("Name saved successfully"));

  document.getElementById("nameSection").style.display="none";
  document.getElementById("thanks").style.display="block";

  setTimeout(()=>{
    document.getElementById("thanks").style.display="none";
    document.getElementById("content").style.display="block";
  }, 1500);
}

// agar pehle visit ho chuka ho
if(localStorage.getItem("visitorName")){
  document.getElementById("nameSection").style.display="none";
  document.getElementById("content").style.display="block";
}
</script>

</body>
</html>
