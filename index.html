<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شافع علی – شاعری</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --red:#ad0000;
  --muted:#9aa4b2;
}

body{
  background:var(--bg);
  color:#fff;
  font-family:Inter;
  margin:0;
}

/* HEADER */
header{
  padding:20px;
  text-align:center;
}
header h1{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:2.4rem;
}
header p{
  font-family:"Noto Nastaliq Urdu",serif;
  font-weight:bold;
  font-size:1.1rem;
  margin-top:8px;
}

/* NAV */
nav{
  display:flex;
  gap:8px;
  padding:10px;
  overflow:auto;
}
nav button{
  background:none;
  border:1px solid #444;
  color:#fff;
  padding:6px 14px;
  border-radius:20px;
  cursor:pointer;
}
nav button.active{
  background:var(--red);
  border-color:var(--red);
}

/* LIST */
#list{
  padding:16px;
}
.item{
  background:var(--card);
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  cursor:pointer;
}
.item h3{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.3rem;
  margin:0;
}
.item small{
  color:var(--muted);
  font-size:.75rem;
}
</style>
</head>

<body>

<header>
  <h1>شافع علی</h1>
  <p>میں جو ہوں، شافع ہوں — یعنی کہ رایگاں ہوں</p>
</header>

<nav>
  <button data-type="all" class="active">سب</button>
  <button data-type="ghazal">غزل</button>
  <button data-type="nazm">نظم</button>
  <button data-type="sher">شعر</button>
</nav>

<div id="list">لوڈ ہو رہا ہے…</div>

<script>
const DATA="data.json";
const list=document.getElementById("list");

async function load(type="all"){
  const data=await fetch(DATA).then(r=>r.json());
  list.innerHTML="";

  data.filter(s=>{
    if(type==="all") return true;
    return s.type===type;
  }).forEach(s=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <h3>${s.title}</h3>
      <small>${s.type}</small>
    `;
    d.onclick=()=>location.href=`read.html?id=${s.id}`;
    list.appendChild(d);
  });
}

document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    load(b.dataset.type);
  }
});

load();
</script>

</body>
</html>
