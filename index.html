<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali - Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "2c2a67d7-e712-44c2-8233-9413718f8d75",
    notifyButton:{enable:true}
  });
});
</script>

<style>
/* === SAME DESIGN AS BEFORE – NOT TOUCHED === */
:root{--bg:#0f1115;--card:#161a22;--accent:#ad0000;--white:#fff;--muted:#9aa4b2}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--white);font-family:Inter}
body.lock main,body.lock header,body.lock nav,body.lock footer{filter:blur(6px);pointer-events:none}
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85)}
#gate .box{background:var(--card);padding:26px;border-radius:14px;max-width:360px;text-align:center}
#gate h3{font-family:"Noto Nastaliq Urdu",serif;line-height:2.3}
#gate input,#gate button{width:100%;padding:12px;margin-top:12px;border-radius:8px;border:none}
#gate button{background:var(--accent);color:#fff;font-weight:bold}
.banner{height:240px;background:url('BANNER/unsplash.png.jpg.jpg') center/cover}
.banner-inner{max-width:1200px;margin:auto;height:100%;display:flex;align-items:flex-end;gap:20px;padding:20px}
.logo{width:100px;height:100px;border-radius:50%;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.author-meta h1{font-family:"Noto Nastaliq Urdu",serif;font-size:2.2rem}
.nav{position:sticky;top:0;background:#0f1115;border-bottom:1px solid #000}
.nav ul{max-width:1200px;margin:auto;display:flex;gap:8px;padding:10px;list-style:none}
.nav button{background:none;border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
.nav button.active{background:#315a80}
.wrap{max-width:1200px;margin:auto;padding:16px}
.item{background:var(--card);padding:16px;border-radius:14px;margin-bottom:14px;cursor:pointer}
.item h3{font-family:"Noto Nastaliq Urdu",serif;display:flex;justify-content:space-between}
.heart{color:transparent;-webkit-text-stroke:1.5px red;font-size:20px}
.heart.active{color:red}
</style>
</head>

<body class="lock">

<div id="gate">
  <div class="box">
    <h3>نوٹیفکیشن آن کریں<br><br>اپنا نام درج کریں</h3>
    <input id="username">
    <button id="continueBtn">جاری رکھیں</button>
  </div>
</div>

<header class="banner">
  <div class="banner-inner">
    <div class="logo"><img src="logo/proble.png.png"></div>
    <div class="author-meta">
      <h1>شافع علی</h1>
      <pre>میں جو ہوں، 'شافع' ہوں، یعنی کہ رایگاں ہوں میں
                  تم جو ہو، خیر ہو۔۔۔ جاؤ! اپنا کام کرو</pre>
    </div>
  </div>
</header>

<nav class="nav">
<ul>
  <li><button data-type="all" class="active">سب</button></li>
  <li><button data-type="ghazal">غزل</button></li>
  <li><button data-type="nazm">نظم</button></li>
  <li><button data-type="sher">شعر</button></li>
  <li><button data-type="fav">پسندیدہ</button></li>
</ul>
</nav>

<main class="wrap"><div id="list">لوڈ ہو رہا ہے…</div></main>
<footer style="text-align:center;padding:20px;color:#999">© Shafay Ali</footer>

<script>
const SCRIPT="https://script.google.com/macros/s/AKfycbyfRG0Q0L21pdwhtbVxKyaCFUeDVdFr6sAhIah9DLS0zwNGBBUA27SRlqAo83IWF81oQA/exec";

const list=document.getElementById("list");
const userKey=()=>localStorage.getItem("visitorName");

function store(k,v){localStorage.setItem(k,JSON.stringify(v))}
function load(k){return JSON.parse(localStorage.getItem(k)||"[]")}

/* GATE */
continueBtn.onclick=async()=>{
  const name=username.value.trim();
  if(!name) return alert("نام درج کریں");
  const p=await Notification.requestPermission();
  if(p!=="granted") return alert("نوٹیفکیشن ضروری ہے");
  localStorage.setItem("visitorName",name);
  fetch(`${SCRIPT}?name=${name}&action=visit`);
  document.body.classList.remove("lock");
  gate.style.display="none";
};
if(userKey() && Notification.permission==="granted"){
  document.body.classList.remove("lock");
  gate.style.display="none";
}

/* LOAD */
async function loadShayari(type="all"){
  const res=await fetch("data.json");
  const data=await res.json();
  list.innerHTML="";
  const user=userKey();
  const favs=load("fav_"+user);

  const filtered=data.filter(s=>{
    if(type==="fav") return favs.includes(s.id);
    if(type==="all") return true;
    return s.type===type;
  });

  filtered.forEach(s=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`<h3>${s.title}<span class="heart ${favs.includes(s.id)?"active":""}">❤</span></h3>
    <small style="color:#999">${s.type}</small>`;
    div.onclick=e=>{
      if(e.target.classList.contains("heart")){
        let f=load("fav_"+user);
        f.includes(s.id)?f=f.filter(i=>i!==s.id):f.push(s.id);
        store("fav_"+user,f);
        fetch(`${SCRIPT}?name=${user}&action=favourite_toggle&title=${encodeURIComponent(s.title)}`);
        loadShayari(type);
      }else location.href=`read.html?id=${s.id}`;
    };
    list.appendChild(div);
  });
}

/* NAV */
document.querySelectorAll(".nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    loadShayari(b.dataset.type);
  };
});

loadShayari();
</script>

</body>
</html>
