<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<style>
body{background:#0f1115;color:#fff;font-family:Inter;padding:20px}
.card{
  max-width:800px;margin:auto;background:#161a22;
  padding:28px;border-radius:20px;text-align:center
}
#title{font-family:"Noto Nastaliq Urdu";font-size:2rem}
#text{
  font-family:"Noto Nastaliq Urdu";
  font-size:1.45rem;
  line-height:2.8;
  white-space:pre-wrap;
}
.actions{margin-top:20px;display:flex;gap:10px;justify-content:center}
.btn{
  padding:8px 20px;border-radius:20px;
  border:2px solid #fff;background:none;color:#fff;cursor:pointer
}
.btn.active{background:#fff;color:#000}
.dict{
  border-bottom:1px dotted #aaa;
  cursor:help;
}
</style>
</head>

<body>

<div class="card">
  <h1 id="title"></h1>
  <div id="text"></div>

  <div class="actions">
    <button id="likeBtn" class="btn">پسند آیا</button>
    <button id="favBtn" class="btn">پسندیدہ</button>
    <button class="btn" onclick="history.back()">واپس</button>
  </div>
</div>

<script>
const DATA_URL="data.json";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwNTWcjGMM1TCe35MTpAelr2cTEB5T1rHLIOXqWP3R4xRrSc1EoV7e9GTvBjpc4IOoJOw/exec";

const id=new URLSearchParams(location.search).get("id");
const likes=JSON.parse(localStorage.getItem("likes")||"{}");
let favs=JSON.parse(localStorage.getItem("favs")||"[]");

function log(action,title){
 fetch(`${SCRIPT_URL}?action=${action}&title=${encodeURIComponent(title)}&time=${Date.now()}`);
}

fetch(DATA_URL).then(r=>r.json()).then(data=>{
 const s=data.find(x=>x.id===id);
 title.innerText=s.title;

 let html=s.text;
 if(s.dictionary){
   for(const w in s.dictionary){
     html=html.replace(
       new RegExp(w,"g"),
       `<span class="dict" title="${s.dictionary[w]}">${w}</span>`
     );
   }
 }
 text.innerHTML=html;

 likeBtn.classList.toggle("active",likes[id]);
 favBtn.classList.toggle("active",favs.includes(id));

 likeBtn.onclick=()=>{
   likes[id]=!likes[id];
   localStorage.setItem("likes",JSON.stringify(likes));
   likeBtn.classList.toggle("active",likes[id]);
   log("like",s.title);
 };

 favBtn.onclick=()=>{
   favs.includes(id)?favs=favs.filter(x=>x!==id):favs.push(id);
   localStorage.setItem("favs",JSON.stringify(favs));
   favBtn.classList.toggle("active",favs.includes(id));
   log("favourite",s.title);
 };

 log("read",s.title);
});
</script>

</body>
</html>
