<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari – Shafay Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#161a22;--text:#fff;--muted:#9aa4b2;--red:#ad0000}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui;padding:20px;}
.card{max-width:820px;margin:auto;background:var(--card);border-radius:20px;padding:32px;animation:fadeUp .6s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#title{font-family:"Noto Nastaliq Urdu",serif;font-size:2.1rem;margin-bottom:10px;text-align:center;}
#type{text-align:center;color:var(--muted);margin-bottom:22px;font-size:0.95rem;}
#text{font-family:"Noto Nastaliq Urdu",serif;font-size:1.55rem;line-height:2.9;text-align:center;white-space:pre-wrap;}
.actions{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.btn{padding:10px 22px;border-radius:999px;border:2px solid #fff;background:none;color:#fff;cursor:pointer;font-size:.95rem;transition:.25s ease;}
.btn:hover{transform:scale(1.06)}
.btn-like.active{background:#fff;color:#000;}
.btn-fav.active{background:var(--red);border-color:var(--red);}
.btn-share{border-color:#315a80;color:#315a80}
.btn-back{border-color:#777;color:#ddd}
#dict{margin-top:25px;background:#0f1115;padding:15px;border-radius:10px;}
#dict h4{margin-bottom:8px;}
#dict ul{list-style:none;padding-left:0;}
</style>
</head>

<body>

<div class="card">
  <h1 id="title">لوڈ ہو رہا ہے…</h1>
  <div id="type"></div>
  <div id="text"></div>

  <div class="actions">
    <button class="btn btn-like" id="likeBtn">پسند آیا</button>
    <button class="btn btn-fav" id="favBtn">پسندیدہ</button>
    <button class="btn btn-share" id="shareBtn">شیئر کریں</button>
    <button class="btn btn-back" onclick="location.href='index.html'">واپس جائیں</button>
  </div>

  <div id="dict"></div>
</div>

<script>
const DATA_URL="data.json";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyfRG0Q0L21pdwhtbVxKyaCFUeDVdFr6sAhIah9DLS0zwNGBBUA27SRlqAo83IWF81oQA/exec";
const userName = localStorage.getItem("visitorName");
if(!userName) location.href="index.html";

const id = new URLSearchParams(location.search).get("id");

function logToSheet(name, action, title="", notify=""){
  fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}&action=${encodeURIComponent(action)}&title=${encodeURIComponent(title)}&notify=${encodeURIComponent(notify)}`)
  .then(res=>res.text()).then(console.log).catch(console.error);
}

fetch(DATA_URL)
  .then(r=>r.json())
  .then(data=>{
    const s = data.find(x=>x.id===id);
    if(!s){ document.getElementById("title").innerText="شاعری دستیاب نہیں"; return; }

    document.getElementById("title").innerText = s.title;
    document.getElementById("type").innerText = s.type;
    document.getElementById("text").innerText = s.text;

    // Render dictionary only on click
    const dictDiv = document.getElementById("dict");
    dictDiv.innerHTML = "<h4>لغت / Dictionary</h4><ul></ul>";
    const ul = dictDiv.querySelector("ul");
    for(const word in s.dictionary){
      const li = document.createElement("li");
      li.innerHTML = `<span class="word" style="cursor:pointer;text-decoration:underline;">${word}</span> : <span class="meaning" style="display:none">${s.dictionary[word]}</span>`;
      li.querySelector(".word").onclick=()=>li.querySelector(".meaning").style.display="inline";
      ul.appendChild(li);
    }

    // Initialize likes/favs
    s.favourite = s.favourite || [];
    let liked = s.favourite.includes(userName);
    let fav = s.favourite.includes(userName);

    likeBtn.classList.toggle("active", liked);
    favBtn.classList.toggle("active", fav);

    likeBtn.onclick = ()=>{
      liked = !liked;
      likeBtn.classList.toggle("active", liked);
      const action = liked ? "like" : "unlike";
      if(liked && !s.favourite.includes(userName)) s.favourite.push(userName);
      if(!liked) s.favourite = s.favourite.filter(u=>u!==userName);
      logToSheet(userName, action, s.title, Notification.permission);
    }

    favBtn.onclick = ()=>{
      fav = !fav;
      favBtn.classList.toggle("active", fav);
      const action = fav ? "favourite_add" : "favourite_remove";
      if(fav && !s.favourite.includes(userName)) s.favourite.push(userName);
      if(!fav) s.favourite = s.favourite.filter(u=>u!==userName);
      logToSheet(userName, action, s.title, Notification.permission);
    }

    shareBtn.onclick = ()=>{
      navigator.clipboard.writeText(location.href).then(()=>alert("شیئر کا لنک کاپی ہوگیا"));
      logToSheet(userName, "share", s.title, Notification.permission);
    }

    // Log read
    logToSheet(userName, "read", s.title, Notification.permission);
  })
  .catch(console.error);
</script>

</body>
</html>
