<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry - Shafay Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body{
  background:#0f1115;
  color:#ffffff;
  font-family:Inter,system-ui;
  margin:0;
  padding:20px;
}
.wrap{
  max-width:900px;
  margin:auto;
}
.card{
  background:#161a22;
  border-radius:14px;
  padding:24px;
  margin-top:20px;
  text-align:center;
}
#title{
  font-family:"Noto Nastaliq Urdu", serif;
  font-size:2.2rem;
  margin-bottom:10px;
}
#type{
  color:#9aa4b2;
  margin-bottom:15px;
}
#text{
  font-family:"Noto Nastaliq Urdu", serif;
  font-size:1.5rem;
  line-height:2.2;
  white-space:pre-wrap;
}
.btns{
  margin-top:20px;
}
button{
  background:#ad0000;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px 18px;
  cursor:pointer;
  margin:5px;
}
button:hover{opacity:0.85;}
.back-btn{background:#315a80;}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h2 id="title">Loading...</h2>
    <div id="type"></div>
    <div id="text"></div>

    <div class="btns">
      <button id="favBtn">پسندیدہ</button>
      <button class="back-btn" onclick="history.back()">واپس</button>
    </div>
  </div>
</div>

<script>
const API="https://sheetdb.io/api/v1/dl6yhkvu4ynyy";
const params=new URLSearchParams(window.location.search);
const id=params.get("id");
const favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));

async function fetchData(){
  const res=await fetch(API);
  return await res.json();
}

async function render(){
  const DATA=await fetchData();

  // Find poetry by new id or old keys fallback
  const poetry = DATA.find(p => p.id===id || p.A===id || p.B===id);

  if(!poetry){
    document.getElementById("title").textContent="شاعری دستیاب نہیں";
    document.getElementById("type").textContent="";
    document.getElementById("text").textContent="";
    document.getElementById("favBtn").style.display="none";
    return;
  }

  document.getElementById("title").textContent = poetry.title || poetry.C || "عنوان دستیاب نہیں";
  document.getElementById("type").textContent  = poetry.type  || poetry.B || "";
  document.getElementById("text").innerHTML   = (poetry.text || poetry.D || "مواد دستیاب نہیں").replace(/\n/g,"<br>");

  const favBtn=document.getElementById("favBtn");
  favBtn.textContent = favs.has(poetry.id) ? "پسندیدہ ہٹائیں" : "پسندیدہ";

  favBtn.onclick = () => {
    if(favs.has(poetry.id)) favs.delete(poetry.id);
    else favs.add(poetry.id);
    localStorage.setItem("favs",JSON.stringify([...favs]));
    favBtn.textContent = favs.has(poetry.id) ? "پسندیدہ ہٹائیں" : "پسندیدہ";
  };
}

render();
</script>

</body>
</html>
