<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari Read</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#fff;
  --accent:#ad0000;
  --muted:#9aa4b2;
}
body{
  margin:0;padding:20px;
  font-family:Inter,system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
.card{
  max-width:800px;
  width:100%;
  background:var(--card);
  padding:30px;
  border-radius:14px;
  text-align:center;
  display:flex;
  flex-direction:column;
  gap:20px;
  transition:transform 0.3s, box-shadow 0.3s;
}
.card:hover{transform:scale(1.02);box-shadow:0 15px 35px rgba(0,0,0,0.5);}
#title{font-family:"Noto Nastaliq Urdu",serif;font-size:2rem;}
#type{color:var(--muted);}
#text{font-family:"Noto Nastaliq Urdu",serif;font-size:1.4rem;line-height:2;white-space:pre-wrap;}
.btn-container{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;}
button{padding:10px 20px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;transition:all 0.3s;}
#favBtn{background:#000;color:#fff;font-size:1.2rem;}
#favBtn.filled{background:var(--accent);color:#000;transform:scale(1.2);}
#backBtn{background:#315a80;color:#fff;}
/* Name & notification modal */
#nameModal{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);
  display:flex;justify-content:center;align-items:center;z-index:1000;
}
#nameModal .modal-content{
  background:var(--card);padding:30px;border-radius:12px;text-align:center;
}
#nameModal input{
  padding:12px;border-radius:8px;border:none;font-size:1rem;width:250px;
}
#nameModal button{
  padding:12px 20px;margin-top:12px;background:var(--accent);border:none;color:#000;font-weight:bold;border-radius:8px;cursor:pointer;
}
body.modal-active .card{filter:blur(6px);pointer-events:none;user-select:none;}
</style>
</head>
<body class="modal-active">

<div class="card">
  <h2 id="title">Loading...</h2>
  <div id="type"></div>
  <div id="text"></div>
  <div class="btn-container">
    <button id="favBtn">♡ پسندیدہ</button>
    <button id="backBtn" onclick="history.back()">واپس</button>
  </div>
</div>

<!-- Name & Notification Modal -->
<div id="nameModal">
  <div class="modal-content">
    <h3>براہ کرم اپنا نام درج کریں اور نوٹیفیکیشن آن کریں</h3>
    <input type="text" id="nameInput" placeholder="اپنا نام درج کریں" required>
    <br>
    <button id="nameSubmit">OK</button>
  </div>
</div>

<script>
const API="data.json";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";
const id=new URLSearchParams(location.search).get("id");
let visitorName=localStorage.getItem("visitorName")||"";
const favBtn=document.getElementById("favBtn");

// Send action to Google Sheet
function sendToSheet(action,title){
  const datetime=new Date().toLocaleString("en-US",{timeZone:"Asia/Karachi"});
  fetch(`${SCRIPT_URL}?name=${encodeURIComponent(visitorName)}&datetime=${encodeURIComponent(datetime)}&title=${encodeURIComponent(title)}&action=${action}`, {method:"GET"});
}

// Load Shayari
function loadShayari(){
  fetch(API).then(r=>r.json()).then(data=>{
    const p=data.find(x=>x.id===id);
    if(!p){document.getElementById("title").innerText="شاعری دستیاب نہیں";favBtn.style.display="none"; return;}
    document.getElementById("title").innerText=p.title;
    document.getElementById("type").innerText=p.type;
    document.getElementById("text").innerText=p.text;

    let favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));
    if(favs.has(p.id)) favBtn.classList.add("filled");

    favBtn.onclick=()=>{
      let favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));
      if(favs.has(p.id)){
        favs.delete(p.id); favBtn.classList.remove("filled"); sendToSheet("unfavorite",p.title);
      } else {
        favs.add(p.id); favBtn.classList.add("filled"); sendToSheet("favorite",p.title);
      }
      localStorage.setItem("favs",JSON.stringify([...favs]));
    };
  });
}

// Name modal submit
document.getElementById("nameSubmit").onclick=()=>{
  const name=document.getElementById("nameInput").value.trim();
  if(!name){ alert("براہ کرم اپنا نام درج کریں"); return;}
  visitorName=name;
  localStorage.setItem("visitorName",name);
  document.getElementById("nameModal").style.display="none";
  document.body.classList.remove("modal-active");

  Notification.requestPermission().then(p=>{
    if(p!=="granted"){ alert("نوٹیفیکیشن آن کریں تاکہ نئی شاعری کی اطلاع مل سکے"); }
    else{ loadShayari(); sendToSheet("visit","Read page opened"); }
  });
};

// Auto load if visitor already entered name & notification granted
if(visitorName && Notification.permission==="granted"){
  document.getElementById("nameModal").style.display="none";
  document.body.classList.remove("modal-active");
  loadShayari();
}
</script>
</body>
</html>
