<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<style>
body{background:#0f1115;color:#fff;font-family:Inter;padding:20px}
.card{
  max-width:820px;margin:auto;background:#161a22;
  padding:28px;border-radius:20px;
}
#title{
  font-family:"Noto Nastaliq Urdu",serif;
  text-align:center;font-size:1.9rem;
}
#text{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.4;text-align:center;
  white-space:pre-wrap;margin-top:20px;
}
.actions{
  display:flex;gap:12px;flex-wrap:wrap;
  justify-content:center;margin-top:26px;
}
.btn{
  padding:10px 20px;border-radius:999px;
  border:2px solid #fff;background:none;
  color:#fff;cursor:pointer;
  transition:.25s;
}
.btn:hover{transform:scale(1.07)}
.btn-like.active{background:#fff;color:#000}
.btn-fav.active{background:#ad0000;border-color:#ad0000}
</style>
</head>

<body>

<div class="card">
  <h1 id="title"></h1>
  <div id="text"></div>

  <div class="actions">
    <button class="btn btn-like" id="likeBtn">پسند آیا</button>
    <button class="btn btn-fav" id="favBtn">پسندیدہ</button>
    <button class="btn" id="shareBtn">شیئر کریں</button>
    <button class="btn" onclick="location.href='index.html'">واپس جائیں</button>
  </div>
</div>

<script>
const DATA="data.json";
const SCRIPT="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";

const user=localStorage.getItem("visitorName");
if(!user || Notification.permission!=="granted"){
  location.href="index.html";
}

const id=new URLSearchParams(location.search).get("id");

function log(action,title){
  fetch(`${SCRIPT}?name=${encodeURIComponent(user)}&action=${action}&title=${encodeURIComponent(title)}&notify=${Notification.permission}`);
}

fetch(DATA).then(r=>r.json()).then(d=>{
  const s=d.find(x=>x.id===id);
  if(!s) return;

  title.innerText=s.title;
  text.innerText=s.text;

  let liked=false,fav=false;

  likeBtn.onclick=()=>{
    liked=!liked;
    likeBtn.classList.toggle("active",liked);
    log(liked?"like":"unlike",s.title);
  };

  favBtn.onclick=()=>{
    fav=!fav;
    favBtn.classList.toggle("active",fav);
    log(fav?"favourite_add":"favourite_remove",s.title);
  };

  shareBtn.onclick=()=>{
    navigator.clipboard.writeText(location.href)
    .then(()=>alert("لنک کاپی ہو گیا"));
  };
});
</script>

</body>
</html>
