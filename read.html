<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:Inter,system-ui;
  padding:20px;
  display:flex;
  justify-content:center;
}
.card{
  max-width:800px;
  width:100%;
  background:#161a22;
  padding:20px;
  border-radius:14px;
  text-align:center;
}
#title{font-family:"Noto Nastaliq Urdu",serif;font-size:1.9rem;}
#type{color:#aaa;margin-bottom:10px;}
#text{font-family:"Noto Nastaliq Urdu",serif;font-size:1.4rem;line-height:1.9;white-space:pre-wrap;margin-bottom:20px;}
.btn-container{display:flex;justify-content:center;gap:10px;}
button{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;}
#favBtn{background:#000;color:#fff;font-weight:bold;}
#favBtn.active{background:red;}
</style>
</head>
<body>

<div class="card">
  <h2 id="title">Loading...</h2>
  <div id="type"></div>
  <div id="text"></div>
  <div class="btn-container">
    <button id="favBtn">پسندیدہ</button>
    <button onclick="history.back()">واپس</button>
  </div>
</div>

<script>
const API="data.json"; // local JSON
const id=new URLSearchParams(location.search).get("id");
const favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));

fetch(API)
  .then(r=>r.json())
  .then(data=>{
    const p=data.find(x=>x.id===id);
    const titleEl=document.getElementById("title");
    const typeEl=document.getElementById("type");
    const textEl=document.getElementById("text");
    const favBtn=document.getElementById("favBtn");

    if(!p){
      titleEl.innerText="شاعری دستیاب نہیں";
      favBtn.style.display="none";
      return;
    }

    titleEl.innerText=p.title;
    typeEl.innerText=p.type;
    textEl.innerText=p.text;

    if(favs.has(p.id)) favBtn.classList.add("active");

    favBtn.onclick=()=>{
      favs.has(p.id)?favs.delete(p.id):favs.add(p.id);
      localStorage.setItem("favs",JSON.stringify([...favs]));
      favBtn.classList.toggle("active");
    };
  });
</script>

</body>
</html>
