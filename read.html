<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<style>
/* DESIGN SAME – NOT TOUCHED */
body{background:#0f1115;color:#fff;font-family:Inter;padding:20px}
.card{max-width:820px;margin:auto;background:#161a22;border-radius:20px;padding:32px}
#title{font-family:"Noto Nastaliq Urdu";font-size:2rem;text-align:center}
#text{font-family:"Noto Nastaliq Urdu";font-size:1.5rem;line-height:2.8;text-align:center}
.btn{padding:10px 22px;border-radius:999px;border:2px solid #fff;background:none;color:#fff}
.btn.active{background:#ad0000;border-color:#ad0000}
</style>
</head>

<body>
<div class="card">
<h1 id="title"></h1>
<div id="text"></div>

<div style="text-align:center;margin-top:20px">
<button class="btn" id="like">پسند آیا</button>
<button class="btn" id="fav">پسندیدہ</button>
<button class="btn" onclick="history.back()">واپس</button>
</div>
</div>

<script>
const SCRIPT="https://script.google.com/macros/s/AKfycbyfRG0Q0L21pdwhtbVxKyaCFUeDVdFr6sAhIah9DLS0zwNGBBUA27SRlqAo83IWF81oQA/exec";
const user=localStorage.getItem("visitorName");
const id=new URLSearchParams(location.search).get("id");

function store(k,v){localStorage.setItem(k,JSON.stringify(v))}
function load(k){return JSON.parse(localStorage.getItem(k)||"[]")}

fetch("data.json").then(r=>r.json()).then(data=>{
  const s=data.find(x=>x.id===id);
  title.innerText=s.title;
  text.innerText=s.text;

  let favs=load("fav_"+user);
  let likes=load("like_"+user);

  if(favs.includes(id)) fav.classList.add("active");
  if(likes.includes(id)) like.classList.add("active");

  like.onclick=()=>{
    likes.includes(id)?likes=likes.filter(i=>i!==id):likes.push(id);
    store("like_"+user,likes);
    like.classList.toggle("active");
    fetch(`${SCRIPT}?name=${user}&action=like&title=${encodeURIComponent(s.title)}`);
  };

  fav.onclick=()=>{
    favs.includes(id)?favs=favs.filter(i=>i!==id):favs.push(id);
    store("fav_"+user,favs);
    fav.classList.toggle("active");
    fetch(`${SCRIPT}?name=${user}&action=favourite&title=${encodeURIComponent(s.title)}`);
  };

  fetch(`${SCRIPT}?name=${user}&action=read&title=${encodeURIComponent(s.title)}`);
});
</script>
</body>
</html>
