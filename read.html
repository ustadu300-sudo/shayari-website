<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari – Shafay Ali</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#ffffff;
  --muted:#9aa4b2;
  --red:#ad0000;
  --white:#ffffff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui;
  padding:20px;
}

/* ===== CARD ===== */
.card{
  max-width:820px;
  margin:auto;
  background:var(--card);
  border-radius:20px;
  padding:28px;
  animation:fadeUp .6s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}

/* ===== TITLE ===== */
#title{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.9rem;
  margin-bottom:12px;
  text-align:center;
}

/* ===== TYPE ===== */
#type{
  text-align:center;
  color:var(--muted);
  margin-bottom:18px;
}

/* ===== SHAYARI TEXT ===== */
#text{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.3rem;
  line-height:2.4;
  text-align:center;
  white-space:pre-wrap;
}

/* ===== BUTTON BAR ===== */
.actions{
  margin-top:26px;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}

/* ===== BUTTON BASE ===== */
.btn{
  padding:10px 20px;
  border-radius:999px;
  border:2px solid var(--white);
  background:none;
  color:var(--white);
  cursor:pointer;
  font-size:.95rem;
  transition:.25s ease;
}

.btn:hover{
  transform:scale(1.07);
}

/* ===== LIKE (YOUTUBE STYLE) ===== */
.btn-like.active{
  background:var(--white);
  color:#000;
}

/* ===== PASANDEEDA ===== */
.btn-fav.active{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

/* ===== SHARE ===== */
.btn-share{
  border-color:#315a80;
  color:#315a80;
}

/* ===== BACK ===== */
.btn-back{
  border-color:#777;
  color:#ddd;
}

/* ===== MOBILE ===== */
@media(max-width:600px){
  #title{font-size:1.6rem}
  #text{font-size:1.15rem}
}
</style>
</head>

<body>

<div class="card">
  <h1 id="title">لوڈ ہو رہا ہے…</h1>
  <div id="type"></div>
  <div id="text"></div>

  <div class="actions">
    <button class="btn btn-like" id="likeBtn">پسند آیا</button>
    <button class="btn btn-fav" id="favBtn">پسندیدہ</button>
    <button class="btn btn-share" id="shareBtn">شیئر کریں</button>
    <button class="btn btn-back" onclick="location.href='index.html'">واپس جائیں</button>
  </div>
</div>

<script>
/* ===== CONFIG ===== */
const DATA_URL = "data.json";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";

/* ===== USER CHECK ===== */
const userName = localStorage.getItem("visitorName");
if(!userName || Notification.permission !== "granted"){
  location.href="index.html";
}

/* ===== PARAM ===== */
const id = new URLSearchParams(location.search).get("id");

/* ===== HELPERS ===== */
function logAction(action,title){
  fetch(`${SCRIPT_URL}?name=${encodeURIComponent(userName)}&action=${action}&title=${encodeURIComponent(title)}&notify=${Notification.permission}`);
}

/* ===== LOAD DATA ===== */
fetch(DATA_URL)
.then(r=>r.json())
.then(data=>{
  const s = data.find(x=>x.id===id);
  if(!s){
    document.getElementById("title").innerText="شاعری دستیاب نہیں";
    return;
  }

  document.getElementById("title").innerText = s.title;
  document.getElementById("type").innerText  = s.type;
  document.getElementById("text").innerText  = s.text;

  /* ===== LIKE ===== */
  const likeBtn=document.getElementById("likeBtn");
  let liked=false;

  likeBtn.onclick=()=>{
    liked=!liked;
    likeBtn.classList.toggle("active",liked);
    logAction(liked?"like":"unlike",s.title);
  };

  /* ===== FAV ===== */
  const favBtn=document.getElementById("favBtn");
  let fav=false;

  favBtn.onclick=()=>{
    fav=!fav;
    favBtn.classList.toggle("active",fav);
    logAction(fav?"favourite_add":"favourite_remove",s.title);
  };

  /* ===== SHARE ===== */
  document.getElementById("shareBtn").onclick=()=>{
    const url=location.href;
    navigator.clipboard.writeText(url).then(()=>{
      alert("شاعری کا لنک کاپی ہو گیا");
    });
  };
});
</script>

</body>
</html>
