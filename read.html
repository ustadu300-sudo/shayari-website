<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafay Ali – Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#ffffff;
  --muted:#9aa4b2;
  --accent:#ad0000;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:30px 16px;
}

.reader{
  max-width:900px;
  width:100%;
  background:var(--card);
  border-radius:18px;
  padding:30px 22px 40px;
  text-align:center;
  animation:fade .8s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}

.title{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:2.1rem;
  margin-bottom:8px;
}
.type{
  color:var(--muted);
  margin-bottom:28px;
}

.poetry{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.5rem;
  line-height:2.5;
  white-space:pre-wrap;
}

.line{
  opacity:0;
  animation:lineIn .6s ease forwards;
}
@keyframes lineIn{
  to{opacity:1}
}

.signature{
  margin-top:28px;
  text-align:left;
  font-family:"Noto Nastaliq Urdu",serif;
  color:var(--muted);
}

.actions{
  margin-top:34px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
.actions button{
  padding:10px 18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
  transition:.25s;
}
.like{background:#000;color:#fff}
.like.active{background:var(--accent);color:#000}
.share{background:#315a80;color:#fff}
.back{background:#222;color:#fff}
.actions button:hover{transform:scale(1.07)}

@media(max-width:600px){
  .poetry{font-size:1.35rem}
  .title{font-size:1.8rem}
}
</style>
</head>

<body>

<div class="reader">
  <div id="title" class="title">Loading…</div>
  <div id="type" class="type"></div>
  <div id="poetry" class="poetry"></div>
  <div id="signature" class="signature"></div>

  <div class="actions">
    <button id="likeBtn" class="like">❤ پسند</button>
    <button class="share" onclick="sharePoetry()">شیئر</button>
    <button class="back" onclick="history.back()">واپس</button>
  </div>
</div>

<script>
const API="data.json";
const id=new URLSearchParams(location.search).get("id");

const likes=JSON.parse(localStorage.getItem("likes")||"{}");

fetch(API)
.then(r=>r.json())
.then(data=>{
  const p=data.find(x=>x.id===id);
  if(!p){title.innerText="شاعری دستیاب نہیں";return;}

  title.innerText=p.title;
  type.innerText=p.type.toUpperCase();

  const lines=p.text.split("\n");
  poetry.innerHTML="";
  lines.forEach((l,i)=>{
    if(l.trim().startsWith("—")){
      signature.innerText=l;
      return;
    }
    const d=document.createElement("div");
    d.className="line";
    d.style.animationDelay=`${i*0.15}s`;
    d.innerText=l;
    poetry.appendChild(d);
  });

  // LIKE SYSTEM (admin-visible only)
  if(likes[p.id]) likeBtn.classList.add("active");
  likeBtn.onclick=()=>{
    likes[p.id]=!likes[p.id];
    localStorage.setItem("likes",JSON.stringify(likes));
    likeBtn.classList.toggle("active");
    console.log("ADMIN LIKE DATA:",likes); // 👈 admin can view
  };
});

// SHARE FLOW
function sharePoetry(){
  if(navigator.share){
    navigator.share({
      title:"Shafay Ali – Shayari",
      text:"نئی اور معیاری اردو شاعری",
      url:location.href
    });
  }else{
    alert("Copy link from address bar");
  }
}
</script>

</body>
</html>
