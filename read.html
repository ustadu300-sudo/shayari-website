<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari – Shafay Ali</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<style>
body{background:#0f1115;color:#fff;font-family:Inter;padding:20px}
.card{max-width:820px;margin:auto;background:#161a22;border-radius:20px;padding:32px}
#title{font-family:"Noto Nastaliq Urdu";font-size:2.2rem;text-align:center}
#type{text-align:center;color:#aaa;margin:10px}
#text{font-family:"Noto Nastaliq Urdu";font-size:1.6rem;line-height:3;text-align:center;white-space:pre-line;color:#f5f3e8}

.meaning{color:#f5c542;border-bottom:1px dotted}
.meaning:hover::after{
 content:attr(data-meaning);
 position:absolute;background:#000;color:#fff;padding:6px;border-radius:6px;
}

.btn{margin:8px;padding:10px 22px;border-radius:999px;border:2px solid #fff;background:none;color:#fff}
.btn.active{background:#fff;color:#000}
</style>
</head>

<body>
<div class="card">
<h1 id="title"></h1>
<div id="type"></div>
<div id="text"></div>
<div style="text-align:center">
<button id="like" class="btn">پسند آیا</button>
<button id="fav" class="btn">پسندیدہ</button>
<button class="btn" onclick="history.back()">واپس جائیں</button>
</div>
</div>

<script>
if(!localStorage.visitorName||Notification.permission!=="granted")location.href="index.html";

const DICT={
 "قفس":"پنجرہ","فرقت":"جدائی","تضحیک":"ذلت","قربت":"نزدیکی","جستجو":"تلاش","وفا":"نبھانا"
};

function applyMeanings(t){
 Object.keys(DICT).forEach(w=>{
  t=t.replace(new RegExp(w,"g"),`<span class="meaning" data-meaning="${DICT[w]}">${w}</span>`);
 });
 return t;
}

fetch("data.json").then(r=>r.json()).then(d=>{
 const s=d.find(x=>x.id===new URLSearchParams(location.search).get("id"));
 title.innerText=s.title;
 type.innerText=s.type;
 text.innerHTML=applyMeanings(s.text);
});
</script>
</body>
</html>
