<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:"Noto Nastaliq Urdu",serif;
  padding:20px;
}
.card{
  max-width:820px;margin:auto;
  background:#161a22;
  border-radius:20px;padding:30px;
}
#title{
  font-size:2rem;
  text-align:center;margin-bottom:8px;
}
#type{
  text-align:center;color:#aaa;margin-bottom:22px;
}
#text{
  font-size:1.4rem;     /* 🔥 NORMAL SIZE */
  line-height:2.6;      /* 🔥 WORD BREAK FIX */
  text-align:center;
  white-space:pre-wrap;
  word-break:keep-all;
}
.actions{
  margin-top:28px;
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}
.actions button{
  padding:10px 20px;
  border-radius:999px;
  border:2px solid #fff;
  background:none;color:#fff;
}
</style>
</head>

<body>

<div class="card">
  <h1 id="title"></h1>
  <div id="type"></div>
  <div id="text"></div>

  <div class="actions">
    <button id="likeBtn">پسند آیا</button>
    <button id="favBtn">پسندیدہ</button>
    <button onclick="location.href='index.html'">واپس جائیں</button>
  </div>
</div>

<script>
const id=new URLSearchParams(location.search).get("id");
fetch("data.json").then(r=>r.json()).then(data=>{
  const s=data.find(x=>x.id===id);
  if(!s)return;
  title.innerText=s.title;
  type.innerText=s.type;
  text.innerText=s.text;
});
</script>

</body>
</html>
