<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاعری پڑھیں</title>
<style>
body{background:#0f1115;color:#fff;font-family:Inter,system-ui;padding:20px;}
h1{font-family:"Noto Nastaliq Urdu",serif;font-size:2rem;}
p{line-height:2;direction:rtl;text-align:right;}
</style>
</head>
<body>

<h1 id="title"></h1>
<p id="text"></p>

<script>
const API="https://sheetdb.io/api/v1/dl6yhkvu4ynyy";

// URL se id lena
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch(API)
.then(r=>r.json())
.then(data=>{
    const item = data.find(d=>d.id==id);
    if(item){
        document.getElementById("title").innerText = item.title;
        document.getElementById("text").innerText = item.text;
    } else {
        document.getElementById("title").innerText = "شاعری دستیاب نہیں";
        document.getElementById("text").innerText = "";
    }
});
</script>

</body>
</html>
