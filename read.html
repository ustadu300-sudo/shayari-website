<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:Inter;
  padding:20px;
}
.box{
  max-width:700px;
  margin:auto;
  background:#161a22;
  padding:24px;
  border-radius:18px;
  text-align:center;
}
h1{
  font-family:"Noto Nastaliq Urdu",serif;
  margin-bottom:16px;
}
p{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.4;
}

.like{
  margin-top:20px;
  padding:10px 18px;
  border-radius:30px;
  border:2px solid #fff;
  background:none;
  color:#fff;
  cursor:pointer;
  transition:.3s;
}
.like.active{
  background:#fff;
  color:#000;
}
</style>
</head>

<body>

<div class="box">
  <h1 id="title"></h1>
  <p id="text"></p>
  <button class="like" id="likeBtn">👍 پسند آیا</button>
</div>

<script>
const SCRIPT="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";
const DATA="data.json";
const id=new URLSearchParams(location.search).get("id");
const user=localStorage.getItem("userName");

function log(action,title){
  fetch(`${SCRIPT}?name=${encodeURIComponent(user)}&action=${action}&title=${encodeURIComponent(title)}&notify=${Notification.permission}`);
}

fetch(DATA).then(r=>r.json()).then(d=>{
  const s=d.find(x=>x.id===id);
  document.getElementById("title").textContent=s.title;
  document.getElementById("text").textContent=s.text;

  const btn=document.getElementById("likeBtn");
  btn.onclick=()=>{
    btn.classList.toggle("active");
    log(btn.classList.contains("active")?"like":"unlike",s.title);
  };
});
</script>

</body>
</html>
