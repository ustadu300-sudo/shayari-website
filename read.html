<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
body{background:#0f1115;color:#fff;font-family:Inter,system-ui;padding:20px;}
.card{max-width:800px;margin:auto;background:#161a22;padding:20px;border-radius:14px;text-align:center;}
#title{font-family:"Noto Nastaliq Urdu",serif;font-size:2rem;}
#type{color:#aaa;margin-bottom:10px;}
#text{font-family:"Noto Nastaliq Urdu",serif;font-size:1.5rem;line-height:2;white-space:pre-wrap;}
button{margin-top:20px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;}
#favBtn{
  background:#000;
  color:#fff;
  font-weight:bold;
  margin-left:10px;
  padding:8px 16px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
#favBtn.active{
  background:red;
  color:#fff;
}
.btn-container{
  display:flex;
  justify-content:center;
  margin-top:20px;
  gap:10px;
}
</style>
</head>
<body>

<div class="card">
  <h2 id="title">Loading...</h2>
  <div id="type"></div>
  <div id="text"></div>
  <div class="btn-container">
    <button onclick="history.back()">واپس</button>
    <button id="favBtn">پسندیدہ</button>
  </div>
</div>

<script>
const API="https://sheetdb.io/api/v1/dl6yhkvu4ynyy";
const id=new URLSearchParams(location.search).get("id");
const favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));

async function run(){
  const r=await fetch(API);
  const data=await r.json();
  const p=data.find(x=>x.id===id);

  const titleEl=document.getElementById("title");
  const typeEl=document.getElementById("type");
  const textEl=document.getElementById("text");
  const favBtn=document.getElementById("favBtn");

  if(!p){
    titleEl.innerText="شاعری دستیاب نہیں";
    typeEl.innerText="";
    textEl.innerText="";
    favBtn.style.display="none";
    return;
  }

  titleEl.innerText=p.title;
  typeEl.innerText=p.type;
  textEl.innerText=p.text;

  // Favorite button state
  if(favs.has(p.id)) favBtn.classList.add("active");
  else favBtn.classList.remove("active");

  favBtn.onclick=()=>{
    if(favs.has(p.id)){
      favs.delete(p.id);
    } else {
      favs.add(p.id);
    }
    localStorage.setItem("favs",JSON.stringify([...favs]));
    favBtn.classList.toggle("active");
  }
}
run();
</script>

</body>
</html>
