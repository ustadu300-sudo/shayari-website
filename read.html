<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari – Shafay Ali</title>
<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui;
  padding:20px;
}
#title{font-size:2rem;text-align:center;margin-bottom:10px;}
#type{color:#aaa;text-align:center;margin-bottom:20px;}
#text{white-space:pre-wrap;text-align:center;font-size:1.5rem;line-height:2.5;}
.actions{display:flex;justify-content:center;gap:10px;margin-top:20px;}
.btn{padding:8px 20px;border-radius:6px;border:2px solid #fff;background:none;color:#fff;cursor:pointer;}
.btn:hover{opacity:.8;}
.btn-like.active{background:#fff;color:#000;}
.btn-fav.active{background:#ad0000;border-color:#ad0000;}
#dict{margin-top:20px;}
.word{cursor:pointer;text-decoration:underline;}
.meaning{display:none;}
</style>
</head>
<body>

<h1 id="title">لوڈ ہو رہا ہے…</h1>
<div id="type"></div>
<div id="text"></div>

<div class="actions">
  <button class="btn btn-like" id="likeBtn">پسند آیا</button>
  <button class="btn btn-fav" id="favBtn">پسندیدہ</button>
  <button class="btn btn-back" onclick="location.href='index.html'">واپس جائیں</button>
</div>

<div id="dict"></div>

<script>
const DATA_URL = "data.json";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXT7167jMMrwRkEbSSy0CyBiWNQexc4yK3vIqmHSvE6kC3ZUiXS4iyAhNjFiENn1vxEg/exec";
const userName = localStorage.getItem("visitorName") || "Unknown";
const id = new URLSearchParams(location.search).get("id");

function logToSheet(name, action, title="", notify=""){
  fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}&action=${encodeURIComponent(action)}&title=${encodeURIComponent(title)}&notify=${encodeURIComponent(notify)}`)
  .then(res=>res.text()).then(console.log).catch(console.error);
}

fetch(DATA_URL).then(r=>r.json()).then(data=>{
  const s = data.find(x=>x.id===id);
  if(!s){ document.getElementById("title").innerText="شاعری دستیاب نہیں"; return; }

  document.getElementById("title").innerText = s.title;
  document.getElementById("type").innerText = s.type;
  document.getElementById("text").innerText = s.text;

  const dictDiv = document.getElementById("dict");
  dictDiv.innerHTML = "";
  Object.keys(s.dictionary).forEach(word=>{
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = word;
    span.onclick = ()=>alert(`${word} : ${s.dictionary[word]}`);
    dictDiv.appendChild(span);
    dictDiv.appendChild(document.createTextNode("  "));
  });

  let liked=false, fav=false;

  likeBtn.onclick = ()=>{
    liked = !liked;
    likeBtn.classList.toggle("active", liked);
    logToSheet(userName, liked ? "like" : "unlike", s.title);
  }

  favBtn.onclick = ()=>{
    fav = !fav;
    favBtn.classList.toggle("active", fav);
    logToSheet(userName, fav ? "favourite_add" : "favourite_remove", s.title);
  }

  logToSheet(userName, "read", s.title);
}).catch(console.error);
</script>

</body>
</html>
