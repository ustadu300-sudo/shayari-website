<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari | Shafay Ali</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#ffffff;
  --muted:#9aa4b2;
  --accent:#b00000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui;
}
main{
  max-width:800px;
  margin:auto;
  padding:20px;
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:26px;
  margin-top:20px;
  animation:fadeIn .5s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
.title-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:18px;
}
.title-row h1{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.8rem;
  text-align:center;
}
.heart{
  width:36px;
  height:36px;
  border-radius:50%;
  border:2px solid var(--accent);
  color:var(--accent);
  font-size:18px;
  background:none;
  cursor:pointer;
  transition:all .3s;
}
.heart.filled{
  background:var(--accent);
  color:#000;
  transform:scale(1.2);
}
.poetry{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.25rem;
  line-height:2.8;
  text-align:center;
  direction:rtl;
  margin-top:10px;
}
.actions{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:26px;
}
.actions button{
  padding:10px 18px;
  border-radius:12px;
  border:none;
  font-size:15px;
  cursor:pointer;
  transition:all .3s;
}
.likeBtn{
  background:#315a80;
  color:#fff;
}
.likeBtn.liked{
  background:#4caf50;
  transform:scale(1.1);
}
.shareBtn{
  background:#444;
  color:#fff;
}
.actions button:hover{
  transform:scale(1.08);
}

/* Modal */
#gate{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}
#gate .box{
  background:var(--card);
  padding:28px;
  border-radius:16px;
  text-align:center;
  max-width:320px;
}
#gate h3{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.2;
}
#gate input{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  border:none;
}
#gate button{
  margin-top:14px;
  padding:12px;
  width:100%;
  border:none;
  background:var(--accent);
  color:#000;
  font-weight:bold;
  border-radius:10px;
  cursor:pointer;
}
body.lock main{filter:blur(6px);pointer-events:none}
</style>
</head>

<body class="lock">

<div id="gate">
  <div class="box">
    <h3>
      براہِ کرم اپنا نام درج کریں<br>
      اور نوٹیفیکیشن آن کریں<br>
      تاکہ نئی آنے والی شاعری سے<br>
      باخبر رہ سکیں
    </h3>
    <input id="userName" placeholder="اپنا نام درج کریں">
    <button id="enterBtn">جاری رکھیں</button>
  </div>
</div>

<main>
  <div class="card">
    <div class="title-row">
      <button class="heart" id="favBtn">♡</button>
      <h1 id="title">لوڈ ہو رہا ہے…</h1>
    </div>

    <div class="poetry" id="content"></div>

    <div class="actions">
      <button class="likeBtn" id="likeBtn">👍 پسند آیا</button>
      <button class="shareBtn" id="shareBtn">🔗 شیئر کریں</button>
    </div>
  </div>
</main>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";
const DATA_URL="data.json";

const params=new URLSearchParams(location.search);
const id=params.get("id");

let visitor=localStorage.getItem("visitorName")||"";

const titleEl=document.getElementById("title");
const contentEl=document.getElementById("content");
const favBtn=document.getElementById("favBtn");
const likeBtn=document.getElementById("likeBtn");

function log(action,title){
  const dt=new Date().toLocaleString("en-US",{timeZone:"Asia/Karachi"});
  fetch(`${SCRIPT_URL}?name=${encodeURIComponent(visitor)}&datetime=${encodeURIComponent(dt)}&title=${encodeURIComponent(title)}&action=${action}`);
}

function unlock(){
  document.getElementById("gate").style.display="none";
  document.body.classList.remove("lock");
}

document.getElementById("enterBtn").onclick=()=>{
  const n=document.getElementById("userName").value.trim();
  if(!n){alert("نام درج کریں");return;}
  visitor=n;
  localStorage.setItem("visitorName",n);

  Notification.requestPermission().then(p=>{
    if(p!=="granted"){
      alert("نوٹیفیکیشن آن کیے بغیر مواد دستیاب نہیں");
      return;
    }
    log("visit","");
    unlock();
    loadData();
  });
};

if(visitor && Notification.permission==="granted"){
  unlock();
  loadData();
}

function loadData(){
  fetch(DATA_URL).then(r=>r.json()).then(data=>{
    const s=data.find(x=>String(x.id)===id);
    if(!s){titleEl.textContent="شاعری نہیں ملی";return;}
    titleEl.textContent=s.title;
    contentEl.innerHTML=s.text.replace(/\n/g,"<br>");

    let favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));
    if(favs.has(s.id)) favBtn.classList.add("filled");

    favBtn.onclick=()=>{
      if(favs.has(s.id)){
        favs.delete(s.id);
        favBtn.classList.remove("filled");
        log("unfavorite",s.title);
      }else{
        favs.add(s.id);
        favBtn.classList.add("filled");
        log("favorite",s.title);
      }
      localStorage.setItem("favs",JSON.stringify([...favs]));
    };

    let liked=false;
    likeBtn.onclick=()=>{
      if(liked) return;
      liked=true;
      likeBtn.classList.add("liked");
      log("like",s.title);
    };

    document.getElementById("shareBtn").onclick=()=>{
      navigator.clipboard.writeText(location.href);
      alert("لنک کاپی ہو گیا");
    };

    log("read",s.title);
  });
}
</script>

</body>
</html>
