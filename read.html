<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari – Shafay Ali</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:"Noto Nastaliq Urdu",serif;
  padding:20px;
}

/* CARD */
.card{
  max-width:860px;
  margin:auto;
  background:#161a22;
  border-radius:22px;
  padding:34px;
}

/* TITLE */
#title{
  font-size:2.2rem;
  text-align:center;
  margin-bottom:10px;
}

/* TYPE */
#type{
  text-align:center;
  color:#aaa;
  margin-bottom:24px;
}

/* SHAYARI */
#text{
  font-size:1.6rem;
  line-height:3;
  text-align:center;
  white-space:pre-wrap;   /* ⭐ line break safe */
}

/* BUTTONS */
.actions{
  margin-top:34px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}
.actions button{
  padding:10px 22px;
  border-radius:999px;
  border:2px solid #fff;
  background:none;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
  <h1 id="title"></h1>
  <div id="type"></div>
  <div id="text"></div>

  <div class="actions">
    <button onclick="location.href='index.html'">واپس جائیں</button>
  </div>
</div>

<script>
const id=new URLSearchParams(location.search).get("id");
fetch("data.json").then(r=>r.json()).then(data=>{
  const s=data.find(x=>x.id===id);
  if(!s) return;
  title.innerText=s.title;
  type.innerText=s.type;
  text.innerText=s.text;
});
</script>

</body>
</html>
