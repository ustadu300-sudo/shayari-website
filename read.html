<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry - Shafay Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body {
  background:#0f1115;
  color:#ffffff;
  font-family:Inter,system-ui;
  margin:0;
  padding:20px;
}
.wrap {
  max-width:900px;
  margin:auto;
}
.card {
  background:#161a22;
  border-radius:14px;
  padding:20px;
  margin-top:20px;
}
#title {
  font-family:"Noto Nastaliq Urdu", serif;
  font-size:2rem;
  text-align:center;
  margin-bottom:10px;
}
#text {
  font-family:"Noto Nastaliq Urdu", serif;
  font-size:1.5rem;
  text-align:center;
  line-height:2;
  white-space:pre-wrap;
  margin-top:15px;
}
#type {
  text-align:center;
  color:#9aa4b2;
  margin-bottom:10px;
}
button {
  background:#ad0000;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px 16px;
  cursor:pointer;
  margin-top:15px;
}
button:hover {
  opacity:0.85;
}
.back-btn {
  background:#315a80;
  margin-left:10px;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h2 id="title">Loading...</h2>
    <div id="type"></div>
    <p id="text"></p>
    <button id="favBtn">پسندیدہ</button>
    <button class="back-btn" onclick="window.history.back();">واپس</button>
  </div>
</div>

<script>
const API="https://sheetdb.io/api/v1/dl6yhkvu4ynyy";
const params=new URLSearchParams(window.location.search);
const id=params.get('id');  // Get ID from URL
const favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));

async function fetchData(){ 
  const res=await fetch(API);
  return await res.json();
}

async function render(){
  const DATA=await fetchData();
  const poetry=DATA.find(p=>p.id===id || p.A===id || p.B===id);
  
  if(poetry){
    document.getElementById('title').textContent=poetry.title || poetry.C;
    document.getElementById('type').textContent=poetry.type || poetry.B;
    document.getElementById('text').innerHTML=(poetry.text || poetry.D).replace(/\n/g,'<br>');

    const favBtn=document.getElementById('favBtn');
    favBtn.textContent=favs.has(poetry.id)?"پسندیدہ ہٹائیں":"پسندیدہ";
    favBtn.onclick=()=>{
      if(favs.has(poetry.id)) favs.delete(poetry.id);
      else favs.add(poetry.id);
      localStorage.setItem("favs",JSON.stringify([...favs]));
      favBtn.textContent=favs.has(poetry.id)?"پسندیدہ ہٹائیں":"پسندیدہ";
    }
  } else {
    document.getElementById('title').textContent="شاعری دستیاب نہیں";
    document.getElementById('type').textContent="";
    document.getElementById('text').textContent="";
    document.getElementById('favBtn').style.display="none";
  }
}

render();
</script>

</body>
</html>
