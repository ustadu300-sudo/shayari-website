<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:Inter,system-ui;
  margin:0;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
}

/* Card container */
.card{
  width:90%;
  max-width:800px;
  margin:auto;
  background:#161a22;
  padding:20px;
  border-radius:14px;
  text-align:center;
  word-break: break-word;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

/* Title */
#title{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.9rem;
  line-height:1.4;
  margin-bottom:10px;
}

/* Type */
#type{
  color:#aaa;
  margin-bottom:10px;
  font-size:1.1rem;
}

/* Text / Poetry */
#text{
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1.4rem;
  line-height:1.9;
  white-space:pre-wrap;
  text-align:center; /* Center text */
  margin-bottom:20px;
  word-break: break-word;
}

/* Buttons */
button{
  padding:8px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:1rem;
}

/* Shuffle buttons */
.btn-container{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

/* Swap positions */
.btn-container button:first-child{
  order:2; /* Swap */
}
.btn-container button:last-child{
  order:1;
}

#favBtn{
  background:#000;
  color:#fff;
  font-weight:bold;
}
#favBtn.active{
  background:red;
  color:#fff;
}

/* Mobile adjustments */
@media(max-width:600px){
  .card{
    width:95%;
    padding:16px;
  }
  #title{
    font-size:1.6rem;
  }
  #text{
    font-size:1.2rem;
    line-height:1.8;
  }
  button{
    font-size:0.95rem;
    padding:6px 14px;
  }
}
</style>
</head>
<body>

<div class="card">
  <h2 id="title">Loading...</h2>
  <div id="type"></div>
  <div id="text"></div>
  <div class="btn-container">
    <button id="favBtn">پسندیدہ</button>
    <button onclick="history.back()">واپس</button>
  </div>
</div>

<script>
const API="https://sheetdb.io/api/v1/dl6yhkvu4ynyy";
const id=new URLSearchParams(location.search).get("id");
const favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));

async function run(){
  const r=await fetch(API);
  const data=await r.json();
  const p=data.find(x=>x.id===id);

  const titleEl=document.getElementById("title");
  const typeEl=document.getElementById("type");
  const textEl=document.getElementById("text");
  const favBtn=document.getElementById("favBtn");

  if(!p){
    titleEl.innerText="شاعری دستیاب نہیں";
    typeEl.innerText="";
    textEl.innerText="";
    favBtn.style.display="none";
    return;
  }

  titleEl.innerText=p.title;
  typeEl.innerText=p.type;
  textEl.innerText=p.text;

  if(favs.has(p.id)) favBtn.classList.add("active");
  else favBtn.classList.remove("active");

  favBtn.onclick=()=>{
    if(favs.has(p.id)){
      favs.delete(p.id);
    } else {
      favs.add(p.id);
    }
    localStorage.setItem("favs",JSON.stringify([...favs]));
    favBtn.classList.toggle("active");
  }
}
run();
</script>

</body>
</html>
