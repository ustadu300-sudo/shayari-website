<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Shayari</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter&display=swap" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:Inter;
  padding:20px;
}
.box{
  max-width:700px;
  margin:auto;
  background:#161a22;
  padding:26px;
  border-radius:18px;
  text-align:center;
}
h1{
  font-family:"Noto Nastaliq Urdu",serif;
  margin-bottom:18px;
}
p{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.6;
}

.actions{
  margin-top:24px;
  display:flex;
  justify-content:center;
  gap:12px;
}

.btn{
  border:2px solid #fff;
  background:none;
  color:#fff;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
  transition:.3s;
}
.btn.active{
  background:#fff;
  color:#000;
}
</style>
</head>

<body>

<div class="box">
  <h1 id="title"></h1>
  <p id="text"></p>

  <div class="actions">
    <button class="btn" id="like">👍 پسند آیا</button>
    <button class="btn" id="fav">⭐ پسندیدہ</button>
    <button class="btn" onclick="navigator.share({url:location.href})">🔗 شیئر</button>
  </div>
</div>

<script>
const SCRIPT="https://script.google.com/macros/s/AKfycbwDmvgnt3FxEs_O4eLX1LOHs4z7hf-URJywG2WKkWcRI3hc93vSM_2xIcgHj7H9HLGI/exec";
const id=new URLSearchParams(location.search).get("id");
const user=localStorage.getItem("visitorName");

fetch("data.json").then(r=>r.json()).then(d=>{
  const s=d.find(x=>x.id===id);
  title.textContent=s.title;
  text.textContent=s.text;

  like.onclick=()=>{
    like.classList.toggle("active");
    fetch(`${SCRIPT}?name=${user}&action=like&title=${encodeURIComponent(s.title)}`);
  };

  fav.onclick=()=>{
    fav.classList.toggle("active");
    fetch(`${SCRIPT}?name=${user}&action=favourite&title=${encodeURIComponent(s.title)}`);
  };
});
</script>

</body>
</html>
