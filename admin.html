<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Shayari JSON</title>

<style>
:root{--bg:#0f1115;--card:#161a22;--red:#ad0000}
body{background:var(--bg);color:#fff;font-family:system-ui;padding:20px}

/* ===== LOGIN GATE ===== */
#login{
  position:fixed; inset:0;
  background:rgba(0,0,0,.85);
  display:flex; align-items:center; justify-content:center;
  z-index:9999;
}
#login .box{
  background:var(--card);
  padding:24px;
  border-radius:14px;
  width:100%; max-width:360px;
  text-align:center;
}
#login input, #login button{
  width:100%; padding:12px; margin-top:10px;
  border-radius:8px; border:none;
}
#login button{
  background:var(--red);
  color:#fff; font-weight:bold; cursor:pointer;
}

/* ===== ADMIN ===== */
textarea,select,button{
  width:100%; margin:8px 0; padding:10px;
  border-radius:8px; border:none;
}
button{background:var(--red);color:#fff;font-weight:bold;cursor:pointer}
pre{
  background:#161a22;
  padding:12px;
  border-radius:10px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h3>Admin Login</h3>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin" style="display:none">

<h3>➕ نئی شاعری</h3>

<select id="type">
  <option value="ghazal">غزل</option>
  <option value="nazm">نظم</option>
  <option value="sher">شعر</option>
</select>

<textarea id="text" placeholder="شاعری paste کریں"></textarea>

<button onclick="generate()">Create JSON</button>
<button onclick="copyJSON()">Copy JSON</button>

<pre id="out"></pre>

</div>

<script>
/* ===== LOGIN LOGIC ===== */
function login(){
  const u=user.value.trim();
  const p=pass.value.trim();

  if(u==="admin" && p==="shafayali1234"){
    sessionStorage.setItem("adminLogin","yes");
    loginBox();
  }else{
    alert("غلط username یا password");
  }
}

function loginBox(){
  document.getElementById("login").style.display="none";
  document.getElementById("admin").style.display="block";
}

if(sessionStorage.getItem("adminLogin")==="yes"){
  loginBox();
}

/* ===== JSON GENERATOR ===== */
function generate(){
  const t=text.value.trim();
  if(!t){alert("شاعری لکھیں");return;}

  const words=[...new Set(
    t.replace(/[^\u0600-\u06FF ]/g,"")
     .split(" ")
     .filter(w=>w.length>3)
  )];

  const dict={};
  words.forEach(w=>dict[w]="(meaning)");

  const json={
    id:Date.now().toString(),
    title:t.split("\n")[0],
    type:type.value,
    text:t,
    dictionary:dict
  };

  out.textContent=JSON.stringify(json,null,2);
}

function copyJSON(){
  navigator.clipboard.writeText(out.textContent);
  alert("JSON copied");
}
</script>

</body>
</html>
