<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Shayari Add</title>
<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui;
  padding:20px;
}
input, select, textarea, button{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:6px;
  border:none;
}
textarea{height:120px}
button{
  background:#ad0000;
  color:#fff;
  font-weight:bold;
  font-size:1rem;
  cursor:pointer;
  margin-top:5px;
}
pre{
  background:#161a22;
  padding:10px;
  overflow:auto;
  word-break: break-word;
  max-height:300px;
}
label{
  display:block;
  margin-top:10px;
  font-weight:bold;
  color:#fff;
}
#copyBtn{
  background:#315a80;
}
</style>
</head>
<body>

<h2>➕ Shayari / Nazm / Ghazal Add Karo</h2>

<label>عنوان / Title</label>
<input id="title" placeholder="مثال: محبت کی سزا">

<label>قسم / Type</label>
<select id="type">
  <option value="ghazal">غزل</option>
  <option value="nazm">نظم</option>
  <option value="sher">شعر</option>
</select>

<label>شاعری / Text</label>
<textarea id="text" placeholder="یہاں شاعری لکھیں"></textarea>

<button onclick="generateArray()">JSON Array تیار کریں</button>
<button id="copyBtn" onclick="copyArray()">Copy JSON Array</button>

<h3>📋 Copy this and paste in data.json:</h3>
<pre id="output"></pre>

<script>
const tempArray=[]; // temporary array

function generateArray(){
  const t=document.getElementById("title").value.trim();
  const ty=document.getElementById("type").value;
  const txt=document.getElementById("text").value.trim();

  if(!t || !txt){
    alert("Title اور Text لازمی ہیں!");
    return;
  }

  const obj={
    id: Date.now().toString(),
    title: t,
    type: ty,
    text: txt
  };

  tempArray.push(obj);

  // Generate array JSON
  document.getElementById("output").textContent = JSON.stringify(tempArray, null, 2);
}

function copyArray(){
  const output=document.getElementById("output");
  if(!output.textContent){
    alert("پہلے JSON Array تیار کریں!");
    return;
  }
  navigator.clipboard.writeText(output.textContent).then(()=>{
    alert("JSON Array clipboard میں copy ہو گیا!");
  }).catch(()=>{
    alert("Copy کرنے میں مسئلہ آیا!");
  });
}
</script>

</body>
</html>
