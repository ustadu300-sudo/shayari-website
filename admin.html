<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Shayari & Dictionary</title>
<style>
body{background:#0f1115;color:#fff;font-family:system-ui;padding:20px;}
input,textarea,select,button{width:100%;margin:6px 0;padding:10px;border-radius:6px;border:none;font-size:1rem;}
textarea{height:120px;}
button{background:#ad0000;color:#fff;font-weight:bold;cursor:pointer;}
pre{background:#161a22;padding:10px;border-radius:8px;max-height:300px;overflow:auto;}
h3{margin-top:30px;}
#dictionaryList{margin-top:15px;}
.word-item{display:flex;align-items:center;margin-bottom:6px;gap:6px;}
.word-item input{flex:1;}
</style>
</head>
<body>

<h2>➕ شاعری شامل کریں</h2>

<input id="title" placeholder="عنوان">
<select id="type">
  <option value="ghazal">غزل</option>
  <option value="nazm">نظم</option>
  <option value="sher">شعر</option>
</select>
<textarea id="text" placeholder="شاعری یہاں پیسٹ کریں"></textarea>
<button id="parseBtn">Shayari سے الفاظ نکالیں</button>

<h3>📚 Dictionary</h3>
<div id="dictionaryList"></div>

<button id="createJsonBtn">Create JSON</button>
<button id="copyJsonBtn">Copy JSON</button>

<h3>📦 data.json</h3>
<pre id="out"></pre>

<script>
const data=[]; // shayari array
let dict = {}; // dictionary

function extractWords(text){
  // split words by space and punctuation
  const words = text.match(/[\u0600-\u06FF]+/g) || [];
  return [...new Set(words)]; // unique words
}

const titleInput = document.getElementById('title');
const typeInput = document.getElementById('type');
const textInput = document.getElementById('text');
const dictionaryList = document.getElementById('dictionaryList');
const outPre = document.getElementById('out');

document.getElementById('parseBtn').onclick = () => {
  const words = extractWords(textInput.value);
  dict = {};
  dictionaryList.innerHTML = '';
  words.forEach(w => {
    dict[w] = '';
    const div = document.createElement('div');
    div.className = 'word-item';
    const span = document.createElement('span');
    span.innerText = w;
    const input = document.createElement('input');
    input.placeholder = 'مختصر معنی لکھیں';
    input.oninput = () => dict[w] = input.value;
    div.appendChild(span);
    div.appendChild(input);
    dictionaryList.appendChild(div);
  });
};

document.getElementById('createJsonBtn').onclick = () => {
  if(!titleInput.value || !textInput.value) return alert('عنوان اور شاعری درج کریں');
  data.push({
    id:Date.now().toString(),
    title: titleInput.value,
    type: typeInput.value,
    text: textInput.value,
    dictionary: dict
  });
  render();
};

document.getElementById('copyJsonBtn').onclick = () => {
  navigator.clipboard.writeText(JSON.stringify({shayari:data}, null, 2));
  alert('JSON copied!');
};

function render(){
  outPre.textContent = JSON.stringify({shayari:data}, null, 2);
}
</script>

</body>
</html>
