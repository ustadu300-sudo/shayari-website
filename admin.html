<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari – Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#161a22;--text:#fff;--muted:#9aa4b2;--red:#ad0000}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui;padding:20px;}
.card{max-width:820px;margin:auto;background:var(--card);border-radius:20px;padding:32px;animation:fadeUp .6s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
input,textarea,select,button{width:100%;margin:6px 0;padding:10px;border-radius:6px;border:none;}
textarea{height:120px;}
#title{font-family:"Noto Nastaliq Urdu",serif;font-size:2.1rem;margin-bottom:10px;text-align:center;}
#type{text-align:center;color:var(--muted);margin-bottom:22px;font-size:0.95rem;}
#text{font-family:"Noto Nastaliq Urdu",serif;font-size:1.55rem;line-height:2.9;text-align:center;white-space:pre-wrap;}
button{background:var(--red);color:#fff;font-weight:bold;cursor:pointer;}
#out{background:#161a22;padding:10px;border-radius:8px;max-height:400px;overflow:auto;margin-top:20px;}
#dict{margin-top:25px;background:#0f1115;padding:15px;border-radius:10px;transition:all .3s ease;}
#dict h4{margin-bottom:8px;}
#dict ul{list-style:none;padding-left:0;}
</style>
</head>
<body>

<div class="card">
  <h2>➕ نئی شاعری شامل کریں</h2>
  <input id="title" placeholder="عنوان">
  <select id="type">
    <option value="ghazal">غزل</option>
    <option value="nazm">نظم</option>
    <option value="sher">شعر</option>
  </select>
  <textarea id="text" placeholder="شاعری یہاں درج کریں"></textarea>
  <button onclick="addShayari()">Create JSON Shayari</button>

  <h3>📦 Generated JSON</h3>
  <pre id="out"></pre>
</div>

<script>
const data = [];

// Predefined Urdu meanings for common difficult words
const predefinedMeanings = {
  "شافع":"لکھنے والا یا نام",
  "چھوڑنا":"رہنا یا جانے دینا",
  "سیکھا":"علم حاصل کیا",
  "نہیں":"انکار یا رد",
  "لوگ":"افراد، لوگ",
  "تمھیں":"آپ کو",
  "چھوڑتے":"چھوڑ دینا",
  "محبت":"دل سے لگاؤ",
  "دل":"جذبات کا مرکز",
  "غم":"اداسی، دکھ",
  "ہجر":"جدائی، دوری",
  "یاد":"یادداشت، یاد کرنا",
  "وقت":"لمحہ یا دن",
  "زندگی":"جیون، حیات"
};

function getSimpleMeaning(word){
  if(predefinedMeanings[word]) return predefinedMeanings[word];
  // For unknown words, just show first 2–3 chars as “simple meaning” placeholder
  return word.slice(0,3) + "…";
}

function addShayari() {
  const titleVal = document.getElementById("title").value.trim();
  const typeVal = document.getElementById("type").value;
  const textVal = document.getElementById("text").value.trim();

  if(!titleVal || !textVal){ alert("عنوان اور شاعری درج کریں"); return; }

  // Split text into words (Urdu words)
  const words = textVal.match(/\b[^\s]+\b/g) || [];
  const dictionary = {};

  // Add up to 7 words automatically with meaning
  let added = 0;
  for(let w of words){
    if(added >= 7) break;
    if(!dictionary[w]){
      dictionary[w] = getSimpleMeaning(w);
      added++;
    }
  }

  const shayariObj = {
    id: Date.now().toString(),
    title: titleVal,
    type: typeVal,
    text: textVal,
    dictionary: dictionary
  };

  data.push(shayariObj);
  render();
}

function render(){
  document.getElementById("out").textContent = JSON.stringify(data,null,2);
}
</script>

</body>
</html>
