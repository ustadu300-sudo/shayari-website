<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari – Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#fff;
  --muted:#9aa4b2;
  --red:#ad0000;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui;
  padding:20px;
  margin:0;
}
.card{
  max-width:900px;
  margin:auto;
  background:var(--card);
  border-radius:20px;
  padding:32px;
  box-sizing:border-box;
}
h2{font-family:"Noto Nastaliq Urdu",serif;margin-bottom:15px;text-align:center;}
input,textarea,select,button{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:8px;
  border:none;
  box-sizing:border-box;
  font-family:"Noto Nastaliq Urdu",serif;
}
textarea{min-height:120px;resize:vertical;}
button{
  background:var(--red);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:.25s ease;
}
button:hover{transform:scale(1.03);}
#out{
  background:#161a22;
  padding:12px;
  border-radius:10px;
  max-height:400px;
  overflow:auto;
  margin-top:15px;
  white-space:pre-wrap;
  word-wrap:break-word;
}
.actions{
  display:flex;
  gap:12px;
  margin-top:12px;
  flex-wrap:wrap;
}
.actions button{flex:1;}
@media(max-width:600px){
  .card{padding:20px;}
  h2{font-size:1.6rem;}
}
</style>
</head>
<body>

<div class="card">
  <h2>نئی شاعری شامل کریں</h2>
  <input id="title" placeholder="عنوان">
  <select id="type">
    <option value="ghazal">غزل</option>
    <option value="nazm">نظم</option>
    <option value="sher">شعر</option>
  </select>
  <textarea id="text" placeholder="شاعری یہاں درج کریں"></textarea>

  <div class="actions">
    <button onclick="addShayari()">Create JSON</button>
    <button onclick="copyJSON()">Copy JSON</button>
  </div>

  <h3 style="margin-top:20px;text-align:center;">Generated JSON</h3>
  <pre id="out"></pre>
</div>

<script>
const data = [];

// Predefined meanings for common hard words
const predefinedMeanings = {
  "ہجر":"جدائی، دوری",
  "محبت":"دل سے لگاؤ",
  "شاعر":"لکھنے والا",
  "دل":"جذبات کا مرکز",
  "غم":"اداسی، دکھ",
  "یاد":"یاد رکھنا، یادداشت",
  "زندگی":"جیون، حیات",
  "وقت":"لمحہ یا دن",
  "عشق":"دل سے لگاؤ",
  "رنج":"دکھ، دکھ کا سبب",
  "درد":"دل کا دکھ",
  "جفا":"ظلم، ناانصافی"
};

function getSimpleMeaning(word){
  if(predefinedMeanings[word]) return predefinedMeanings[word];
  return word.slice(0,3) + "…"; // simple fallback
}

function addShayari(){
  const title = document.getElementById("title").value.trim();
  const type = document.getElementById("type").value;
  const text = document.getElementById("text").value.trim();
  if(!title || !text){ alert("عنوان اور شاعری درج کریں"); return; }

  // Extract Urdu words (basic word split)
  const words = text.match(/\b[^\s]+\b/g) || [];
  const dictionary = {};
  let added = 0;
  for(let w of words){
    if(added >= 7) break; // max 7 dictionary words
    if(!dictionary[w]){
      dictionary[w] = getSimpleMeaning(w);
      added++;
    }
  }

  const obj = {
    id: Date.now().toString(),
    title,
    type,
    text,
    dictionary
  };

  data.push(obj);
  render();
}

function render(){
  document.getElementById("out").textContent = JSON.stringify(data,null,2);
}

function copyJSON(){
  const out = document.getElementById("out").textContent;
  if(!out){ alert("کوئی JSON نہیں ہے"); return; }
  navigator.clipboard.writeText(out).then(()=>alert("JSON کاپی ہوگیا"));
}
</script>

</body>
</html>
