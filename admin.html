<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Admin – Shayari JSON</title>
<style>
body{background:#0f1115;color:#fff;font-family:system-ui;padding:20px}
textarea,select,button{width:100%;margin:8px 0;padding:10px;border-radius:8px;border:none}
button{background:#ad0000;color:#fff;font-weight:bold}
pre{background:#161a22;padding:12px;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>

<h3>➕ نئی شاعری</h3>
<select id="type">
  <option value="ghazal">غزل</option>
  <option value="nazm">نظم</option>
  <option value="sher">شعر</option>
</select>

<textarea id="text" placeholder="شاعری paste کریں"></textarea>
<button onclick="generate()">Create JSON</button>
<button onclick="copy()">Copy JSON</button>

<pre id="out"></pre>

<script>
function generate(){
  const t=text.value.trim();
  const words=[...new Set(t.replace(/[^\u0600-\u06FF ]/g,"").split(" ").filter(w=>w.length>3))];
  const dict={};
  words.forEach(w=>dict[w]="(meaning)");

  const json={
    id:Date.now().toString(),
    title:t.split("\n")[0],
    type:type.value,
    text:t,
    dictionary:dict
  };
  out.textContent=JSON.stringify(json,null,2);
}
function copy(){
  navigator.clipboard.writeText(out.textContent);
  alert("JSON copied");
}
</script>

</body>
</html>
