<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Shayari Add</title>

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui;
  padding:20px;
}
input, select, textarea, button{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:6px;
  border:none;
}
textarea{height:140px}
button{
  background:#ad0000;
  color:#fff;
  font-weight:bold;
  font-size:1rem;
  cursor:pointer;
}
#copyBtn{
  background:#315a80;
}
pre{
  background:#161a22;
  padding:12px;
  overflow:auto;
  word-break: break-word;
  max-height:320px;
  border-radius:8px;
}
label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>➕ Shayari / Nazm / Ghazal Add Panel</h2>

<label>عنوان / Title</label>
<input id="title" placeholder="مثال: محبت کی سزا">

<label>قسم / Type</label>
<select id="type">
  <option value="ghazal">غزل</option>
  <option value="nazm">نظم</option>
  <option value="sher">شعر</option>
</select>

<label>شاعری / Text</label>
<textarea id="text" placeholder="یہاں شاعری لکھیں"></textarea>

<button onclick="addShayari()">➕ Add to JSON</button>
<button id="copyBtn" onclick="copyJSON()">📋 Copy JSON</button>

<h3>⬇️ data.json میں یہ paste کریں:</h3>
<pre id="output">[]</pre>

<script>
/* ===== SETTINGS ===== */
const AUTHOR = "\n\n— شافع";   // watermark name
const dataArray = [];

/* ===== ADD SHAYARI ===== */
function addShayari(){
  const title = document.getElementById("title").value.trim();
  const type  = document.getElementById("type").value;
  const text  = document.getElementById("text").value.trim();

  if(!title || !text){
    alert("Title اور Text لازمی ہیں!");
    return;
  }

  const obj = {
    id: Date.now().toString(),
    type: type,
    title: title,
    text: text + AUTHOR   // 👈 watermark auto add
  };

  dataArray.push(obj);

  document.getElementById("output").textContent =
    JSON.stringify(dataArray, null, 2);

  // clear inputs
  document.getElementById("title").value = "";
  document.getElementById("text").value = "";
}

/* ===== COPY JSON ===== */
function copyJSON(){
  const json = document.getElementById("output").textContent;
  if(!json || json === "[]"){
    alert("ابھی کوئی شاعری add نہیں ہوئی");
    return;
  }
  navigator.clipboard.writeText(json).then(()=>{
    alert("JSON copy ہو گیا ✅\ndata.json میں paste کر دیں");
  });
}
</script>

</body>
</html>
