<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<style>
body{background:#0f1115;color:#fff;font-family:system-ui;padding:20px}
input,textarea,button{width:100%;margin:6px 0;padding:8px}
pre{background:#161a22;padding:10px}
</style>
</head>

<body>

<h2>شاعری</h2>
<input id="title" placeholder="عنوان">
<textarea id="text"></textarea>

<h3>Dictionary</h3>
<input id="word" placeholder="لفظ">
<input id="meaning" placeholder="معنی">
<button onclick="addWord()">لفظ شامل کریں</button>

<button onclick="add()">Add Shayari</button>

<pre id="out"></pre>

<script>
let dict={},arr=[];
function addWord(){dict[word.value]=meaning.value;word.value=meaning.value=""}
function add(){
 arr.push({
  id:Date.now().toString(),
  title:title.value,
  type:"sher",
  text:text.value+"\n\n— شافع",
  dictionary:dict
 });
 out.textContent=JSON.stringify(arr,null,2);
 dict={};
}
</script>

</body>
</html>
